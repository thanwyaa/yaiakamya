<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>يلا كيمياء | المنصة التعليمية</title>
    
    <!-- منع التحميل المزدوج والإطارات -->
    <script>
        (function() {
            // منع تحميل الصفحة داخل إطار iframe
            if (window.top !== window.self) {
                window.top.location = window.self.location;
            }
            
            // منع التحميل المزدوج (إذا تم تحميل الصفحة مرتين)
            if (window.location.search.includes('_r=')) {
                history.replaceState({}, '', window.location.pathname);
            }
            
            // منع حفظ الصفحة (Ctrl+S)
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
                    e.preventDefault();
                    e.returnValue = '';
                }
            });
        })();
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'Tahoma', sans-serif;
            background: #0B4F8C;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* شاشة التحميل */
        #loaderScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(135deg, #0B4F8C, #1E81CE);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.5s ease;
        }
        #loaderScreen .logo {
            font-size: 4rem;
            margin-bottom: 8px;
        }
        #loaderScreen h1 {
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            color: #FFD60A;
            font-size: 2.2rem;
            margin-bottom: 4px;
        }
        #loaderScreen p {
            color: rgba(255,255,255,0.8);
            font-size: 1rem;
            margin-bottom: 24px;
        }
        #loaderScreen .progress-container {
            width: 280px;
            max-width: 80%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        #loaderScreen .progress-container .fill {
            height: 100%;
            width: 0%;
            background: #FFD60A;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        /* التطبيق الرئيسي */
        #mainApp {
            display: none;
            width: 100%;
            height: 100vh;
            background: #fff;
        }
        #mainApp iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* زر إعادة المحاولة */
        .retry-btn {
            margin-top: 16px;
            padding: 10px 32px;
            border-radius: 50px;
            border: none;
            background: #FFD60A;
            color: #081B2C;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            transition: transform 0.2s ease;
        }
        .retry-btn:hover {
            transform: scale(1.05);
        }
        
        @media (max-width: 600px) {
            #loaderScreen .logo { font-size: 3rem; }
            #loaderScreen h1 { font-size: 1.6rem; }
            #loaderScreen p { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <!-- ====== شاشة التحميل ====== -->
    <div id="loaderScreen">
        <div class="logo">🧪</div>
        <h1>يلا كيمياء</h1>
        <p>جاري تجهيز المنصة التعليمية...</p>
        <div class="progress-container">
            <div class="fill" id="progressFill"></div>
        </div>
    </div>

    <!-- ====== التطبيق الرئيسي ====== -->
    <div id="mainApp">
        <iframe id="appFrame" src="/index.html" title="يلا كيمياء"></iframe>
    </div>

    <script>
        (function() {
            'use strict';
            
            // ============================================================
            // 1. منع التحميل المزدوج (تم تنفيذه في الـ head)
            // ============================================================
            
            // ============================================================
            // 2. شاشة التحميل المتقدمة
            // ============================================================
            var progress = 0;
            var progressFill = document.getElementById('progressFill');
            var loaderScreen = document.getElementById('loaderScreen');
            var mainApp = document.getElementById('mainApp');
            var appFrame = document.getElementById('appFrame');
            
            // محاكاة التحميل (0% -> 90%)
            var interval = setInterval(function() {
                progress += Math.random() * 8 + 2; // زيادة أسرع قليلاً
                if (progress > 90) {
                    clearInterval(interval);
                    progress = 90;
                }
                if (progressFill) {
                    progressFill.style.width = Math.min(progress, 90) + '%';
                }
            }, 250);
            
            // عند تحميل الـ iframe بالكامل
            function onFrameLoaded() {
                clearInterval(interval);
                if (progressFill) {
                    progressFill.style.width = '100%';
                }
                
                // إخفاء شاشة التحميل وإظهار التطبيق
                setTimeout(function() {
                    if (loaderScreen) loaderScreen.style.opacity = '0';
                    if (mainApp) mainApp.style.display = 'block';
                    
                    setTimeout(function() {
                        if (loaderScreen) loaderScreen.style.display = 'none';
                    }, 500);
                }, 400);
            }
            
            // مستمع حدث تحميل الـ iframe
            if (appFrame) {
                appFrame.addEventListener('load', onFrameLoaded);
            }
            
            // ============================================================
            // 3. مهلة أمان (في حالة تعطل التحميل)
            // ============================================================
            setTimeout(function() {
                // إذا لم يتم إخفاء شاشة التحميل خلال 12 ثانية
                if (loaderScreen && loaderScreen.style.display !== 'none') {
                    // محاولة التحقق مما إذا كان الـ iframe قد تم تحميله
                    try {
                        var frameDoc = appFrame && appFrame.contentDocument;
                        if (frameDoc && frameDoc.body && frameDoc.body.innerHTML.length > 0) {
                            // الـ iframe محمول فعلاً ولكن الحدث لم يُطلق
                            onFrameLoaded();
                            return;
                        }
                    } catch(e) {
                        // لا يمكن الوصول إلى محتوى الـ iframe (مشكلة أمان أو تحميل)
                    }
                    
                    // عرض رسالة خطأ
                    loaderScreen.innerHTML = `
                        <div style="font-size:3rem;margin-bottom:12px;">⚠️</div>
                        <h1 style="font-family:'Cairo',sans-serif;color:#FFD60A;font-size:2rem;font-weight:900;">حدث خطأ</h1>
                        <p style="color:#fff;font-size:1.1rem;margin-top:4px;">لم نتمكن من تحميل المنصة</p>
                        <button onclick="location.reload()" class="retry-btn">🔄 إعادة المحاولة</button>
                    `;
                    // إعادة تعيين الأنماط
                    loaderScreen.style.display = 'flex';
                    loaderScreen.style.opacity = '1';
                }
            }, 12000); // 12 ثانية مهلة
            
            // ============================================================
            // 4. Service Worker (PWA)
            // ============================================================
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/service-worker.js')
                        .then(function(registration) {
                            console.log('✅ Service Worker registered:', registration);
                        })
                        .catch(function(error) {
                            console.log('❌ Service Worker registration failed:', error);
                        });
                });
            }
            
            // ============================================================
            // 5. منع حفظ الصفحة (Ctrl+S) - تم تنفيذه في الـ head
            // ============================================================
            
            console.log('🚀 Yalla Chemistry Platform Loader v2.0');
            
        })();
    </script>
</body>
</html>
