<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>يلا كيمياء | المنصة التعليمية</title>
    
    <!-- منع التحميل المزدوج والإطارات -->
    <script>
        (function() {
            if (window.top !== window.self) {
                window.top.location = window.self.location;
            }
            if (window.location.search.includes('_r=')) {
                history.replaceState({}, '', window.location.pathname);
            }
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
                    e.preventDefault();
                    e.returnValue = '';
                }
            });
        })();
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'Tahoma', sans-serif;
            background: #0B4F8C;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* شاشة التحميل */
        #loaderScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(135deg, #0B4F8C, #1E81CE);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.5s ease;
        }
        #loaderScreen .logo { font-size: 4rem; margin-bottom: 8px; }
        #loaderScreen h1 {
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            color: #FFD60A;
            font-size: 2.2rem;
            margin-bottom: 4px;
        }
        #loaderScreen p {
            color: rgba(255,255,255,0.8);
            font-size: 1rem;
            margin-bottom: 24px;
        }
        #loaderScreen .progress-container {
            width: 280px;
            max-width: 80%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        #loaderScreen .progress-container .fill {
            height: 100%;
            width: 0%;
            background: #FFD60A;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        /* التطبيق الرئيسي */
        #mainApp {
            display: none;
            width: 100%;
            height: 100vh;
            background: #fff;
            position: relative;
        }
        #mainApp iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* ====== زر التثبيت البارز ====== */
        #installBtn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #FFD60A, #F59E0B);
            color: #081B2C;
            border: none;
            border-radius: 60px;
            font-weight: 800;
            font-size: 1.1rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(255, 214, 10, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: pulse-install 2s infinite;
            min-width: 220px;
            border: 2px solid rgba(255,255,255,0.3);
        }
        #installBtn:hover {
            transform: translateX(-50%) translateY(-3px) scale(1.03);
            box-shadow: 0 12px 40px rgba(255, 214, 10, 0.6);
        }
        #installBtn:active {
            transform: translateX(-50%) scale(0.97);
        }
        #installBtn .icon {
            font-size: 1.6rem;
            line-height: 1;
        }
        #installBtn .blink-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #EF4444;
            border-radius: 50%;
            animation: blink-animation 1s ease-in-out infinite;
            flex-shrink: 0;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.7);
        }
        #installBtn .text {
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }
        #installBtn .badge {
            background: #EF4444;
            color: #fff;
            font-size: 0.55rem;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 700;
            margin-right: 4px;
        }
        #installBtn.installed {
            background: #22C55E;
            color: #fff;
            box-shadow: 0 8px 30px rgba(34, 197, 94, 0.4);
            animation: none;
            border-color: rgba(255,255,255,0.2);
        }
        #installBtn.installed:hover {
            box-shadow: 0 12px 40px rgba(34, 197, 94, 0.5);
            transform: translateX(-50%) translateY(-2px);
        }
        #installBtn.installed .blink-dot {
            display: none;
        }
        
        @keyframes pulse-install {
            0%, 100% { box-shadow: 0 8px 30px rgba(255, 214, 10, 0.5); }
            50% { box-shadow: 0 8px 50px rgba(255, 214, 10, 0.3); }
        }
        @keyframes blink-animation {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.6); }
        }
        
        /* زر إعادة المحاولة */
        .retry-btn {
            margin-top: 16px;
            padding: 10px 32px;
            border-radius: 50px;
            border: none;
            background: #FFD60A;
            color: #081B2C;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            transition: transform 0.2s ease;
        }
        .retry-btn:hover { transform: scale(1.05); }
        
        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            width: 90%;
            max-width: 450px;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            padding: 14px 24px;
            border-radius: 16px;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            animation: slideUp 0.4s ease;
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }
        .toast-success { background: #22C55E; }
        .toast-error { background: #EF4444; }
        .toast-info { background: #0B4F8C; }
        .toast-warning { background: #F59E0B; color: #081B2C; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 600px) {
            #loaderScreen .logo { font-size: 3rem; }
            #loaderScreen h1 { font-size: 1.6rem; }
            #loaderScreen p { font-size: 0.9rem; }
            #installBtn {
                bottom: 20px;
                padding: 12px 20px;
                font-size: 0.9rem;
                min-width: 180px;
                gap: 8px;
            }
            #installBtn .icon { font-size: 1.3rem; }
            #installBtn .blink-dot { width: 10px; height: 10px; }
            #installBtn .text { font-size: 0.9rem; }
            .toast { font-size: 0.85rem; padding: 12px 18px; }
            .toast-container { bottom: 100px; }
        }
        
        @media (max-width: 400px) {
            #installBtn {
                bottom: 16px;
                padding: 10px 16px;
                font-size: 0.8rem;
                min-width: 150px;
                gap: 6px;
            }
            #installBtn .icon { font-size: 1.1rem; }
            #installBtn .blink-dot { width: 8px; height: 8px; }
            #installBtn .text { font-size: 0.8rem; }
            .toast-container { bottom: 80px; }
        }
    </style>
</head>
<body>

    <!-- ====== شاشة التحميل ====== -->
    <div id="loaderScreen">
        <div class="logo">🧪</div>
        <h1>يلا كيمياء</h1>
        <p>جاري تجهيز المنصة التعليمية...</p>
        <div class="progress-container">
            <div class="fill" id="progressFill"></div>
        </div>
    </div>

    <!-- ====== التطبيق الرئيسي ====== -->
    <div id="mainApp">
        <iframe id="appFrame" src="/index.html" title="يلا كيمياء"></iframe>
    </div>

    <!-- ====== حاوية الـ Toast ====== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ====== زر التثبيت (PWA) - بارز وجذاب ====== -->
    <button id="installBtn">
        <span class="blink-dot"></span>
        <span class="icon">📲</span>
        <span class="text">حمل التطبيق الآن</span>
        <span class="badge">جديد</span>
    </button>

    <script>
        (function() {
            'use strict';
            
            // ============================================================
            // 1. منع التحميل المزدوج (تم تنفيذه في الـ head)
            // ============================================================
            
            // ============================================================
            // 2. شاشة التحميل المتقدمة
            // ============================================================
            var progress = 0;
            var progressFill = document.getElementById('progressFill');
            var loaderScreen = document.getElementById('loaderScreen');
            var mainApp = document.getElementById('mainApp');
            var appFrame = document.getElementById('appFrame');
            
            var interval = setInterval(function() {
                progress += Math.random() * 8 + 2;
                if (progress > 90) {
                    clearInterval(interval);
                    progress = 90;
                }
                if (progressFill) {
                    progressFill.style.width = Math.min(progress, 90) + '%';
                }
            }, 250);
            
            function onFrameLoaded() {
                clearInterval(interval);
                if (progressFill) {
                    progressFill.style.width = '100%';
                }
                setTimeout(function() {
                    if (loaderScreen) loaderScreen.style.opacity = '0';
                    if (mainApp) mainApp.style.display = 'block';
                    setTimeout(function() {
                        if (loaderScreen) loaderScreen.style.display = 'none';
                        checkAndShowInstallButton();
                    }, 500);
                }, 400);
            }
            
            if (appFrame) {
                appFrame.addEventListener('load', onFrameLoaded);
            }
            
            // ============================================================
            // 3. مهلة أمان
            // ============================================================
            setTimeout(function() {
                if (loaderScreen && loaderScreen.style.display !== 'none') {
                    try {
                        var frameDoc = appFrame && appFrame.contentDocument;
                        if (frameDoc && frameDoc.body && frameDoc.body.innerHTML.length > 0) {
                            onFrameLoaded();
                            return;
                        }
                    } catch(e) {}
                    
                    loaderScreen.innerHTML = `
                        <div style="font-size:3rem;margin-bottom:12px;">⚠️</div>
                        <h1 style="font-family:'Cairo',sans-serif;color:#FFD60A;font-size:2rem;font-weight:900;">حدث خطأ</h1>
                        <p style="color:#fff;font-size:1.1rem;margin-top:4px;">لم نتمكن من تحميل المنصة</p>
                        <button onclick="location.reload()" class="retry-btn">🔄 إعادة المحاولة</button>
                    `;
                    loaderScreen.style.display = 'flex';
                    loaderScreen.style.opacity = '1';
                }
            }, 12000);
            
            // ============================================================
            // 4. Service Worker (PWA)
            // ============================================================
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/service-worker.js')
                        .then(function(registration) {
                            console.log('✅ Service Worker registered:', registration);
                        })
                        .catch(function(error) {
                            console.log('❌ Service Worker registration failed:', error);
                        });
                });
            }
            
            // ============================================================
            // 5. زر التثبيت (PWA Native Install) - المحور الرئيسي
            // ============================================================
            var installBtn = document.getElementById('installBtn');
            var toastContainer = document.getElementById('toastContainer');
            var deferredPrompt = null;
            
            // دالة عرض Toast
            function showToast(msg, type) {
                if (!toastContainer) return;
                var toast = document.createElement('div');
                toast.className = 'toast toast-' + (type || 'success');
                toast.textContent = msg;
                toastContainer.appendChild(toast);
                setTimeout(function() {
                    toast.style.opacity = '0';
                    toast.style.transition = 'opacity 0.4s ease';
                    setTimeout(function() { toast.remove(); }, 500);
                }, 3500);
            }
            
            // التحقق من تثبيت التطبيق
            function isAppInstalled() {
                return window.matchMedia('(display-mode: standalone)').matches || 
                       window.navigator.standalone === true;
            }
            
            // إظهار/إخفاء زر التثبيت
            function checkAndShowInstallButton() {
                // إذا كان التطبيق مثبتاً، أظهر الزر كـ "تم التثبيت"
                if (isAppInstalled()) {
                    if (installBtn) {
                        installBtn.innerHTML = `
                            <span class="icon">✅</span>
                            <span class="text">تم تثبيت التطبيق</span>
                        `;
                        installBtn.classList.add('installed');
                        installBtn.style.display = 'flex';
                        installBtn.disabled = true;
                        installBtn.style.cursor = 'default';
                    }
                    return;
                }
                
                // إذا كان الحدث محفوظاً، أظهر الزر
                if (deferredPrompt) {
                    if (installBtn) {
                        installBtn.style.display = 'flex';
                        installBtn.disabled = false;
                        installBtn.innerHTML = `
                            <span class="blink-dot"></span>
                            <span class="icon">📲</span>
                            <span class="text">حمل التطبيق الآن</span>
                            <span class="badge">جديد</span>
                        `;
                        installBtn.classList.remove('installed');
                    }
                } else {
                    // إذا لم يكن هناك حدث، حاول إظهار الزر مع رسالة توجيهية
                    if (installBtn && !isAppInstalled()) {
                        // في بعض المتصفحات قد لا يعمل beforeinstallprompt
                        // نعرض الزر مع رسالة توجيهية
                        installBtn.style.display = 'flex';
                        installBtn.disabled = false;
                        installBtn.innerHTML = `
                            <span class="icon">📲</span>
                            <span class="text">تثبيت التطبيق</span>
                            <span class="badge">📌</span>
                        `;
                        installBtn.classList.remove('installed');
                        // إزالة الـ blink-dot لأننا لا نعرف إذا كان التثبيت متاحاً
                        // لكننا نعرض الزر كخيار
                    }
                }
            }
            
            // التقاط حدث beforeinstallprompt
            window.addEventListener('beforeinstallprompt', function(e) {
                e.preventDefault();
                deferredPrompt = e;
                console.log('📱 beforeinstallprompt captured');
                
                if (!isAppInstalled()) {
                    if (installBtn) {
                        installBtn.style.display = 'flex';
                        installBtn.disabled = false;
                        installBtn.innerHTML = `
                            <span class="blink-dot"></span>
                            <span class="icon">📲</span>
                            <span class="text">حمل التطبيق الآن</span>
                            <span class="badge">جديد</span>
                        `;
                        installBtn.classList.remove('installed');
                    }
                }
            });
            
            // عند تثبيت التطبيق
            window.addEventListener('appinstalled', function() {
                console.log('✅ تم تثبيت التطبيق بنجاح');
                if (installBtn) {
                    installBtn.innerHTML = `
                        <span class="icon">✅</span>
                        <span class="text">تم تثبيت التطبيق</span>
                    `;
                    installBtn.classList.add('installed');
                    installBtn.disabled = true;
                    installBtn.style.cursor = 'default';
                }
                deferredPrompt = null;
                showToast('✅ تم تثبيت التطبيق بنجاح!', 'success');
            });
            
            // حدث النقر على زر التثبيت
            if (installBtn) {
                installBtn.addEventListener('click', async function() {
                    // إذا كان التطبيق مثبتاً
                    if (isAppInstalled()) {
                        showToast('✅ التطبيق مثبت بالفعل', 'info');
                        return;
                    }
                    
                    // إذا كان هناك حدث beforeinstallprompt محفوظ
                    if (deferredPrompt) {
                        try {
                            // عرض نافذة التثبيت الرسمية
                            deferredPrompt.prompt();
                            var result = await deferredPrompt.userChoice;
                            
                            if (result.outcome === 'accepted') {
                                console.log('✅ تم تثبيت التطبيق');
                                showToast('✅ جاري تثبيت التطبيق...', 'success');
                            } else {
                                console.log('❌ تم إلغاء التثبيت');
                                showToast('تم إلغاء تثبيت التطبيق', 'info');
                            }
                            
                            deferredPrompt = null;
                            // إخفاء الزر مؤقتاً
                            if (installBtn) {
                                installBtn.style.display = 'none';
                            }
                        } catch (err) {
                            console.error('Install error:', err);
                            showToast('حدث خطأ أثناء التثبيت', 'error');
                        }
                        return;
                    }
                    
                    // إذا لم يكن هناك حدث (المتصفح لا يدعم أو تم الرفض سابقاً)
                    // نعرض تعليمات التثبيت اليدوي
                    showInstallHelp();
                });
            }
            
            // ============================================================
            // 6. تعليمات التثبيت اليدوي (عند عدم توفر beforeinstallprompt)
            // ============================================================
            function showInstallHelp() {
                var helpModal = document.createElement('div');
                helpModal.style.cssText = `
                    position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);
                    z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;
                `;
                helpModal.innerHTML = `
                    <div style="background:#fff;border-radius:24px;padding:32px;max-width:420px;width:100%;text-align:center;border:3px solid #FFD60A;box-shadow:0 20px 60px rgba(0,0,0,0.5);direction:rtl;">
                        <div style="font-size:3.5rem;margin-bottom:12px;">📱</div>
                        <h3 style="font-weight:800;color:#081B2C;margin-bottom:8px;font-size:1.4rem;">كيفية تثبيت التطبيق</h3>
                        <div style="text-align:right;line-height:2.6;font-size:0.95rem;color:#555;margin:16px 0;padding:0 8px;">
                            <p>📍 1. اضغط على <strong style="color:#0B4F8C;">القائمة</strong> (⋮) في المتصفح</p>
                            <p>📍 2. اختر <strong style="color:#0B4F8C;">"تثبيت التطبيق"</strong> أو <strong style="color:#0B4F8C;">"Install App"</strong></p>
                            <p>📍 3. اضغط على <strong style="color:#0B4F8C;">"تثبيت"</strong></p>
                        </div>
                        <div style="background:#f0f7ff;padding:10px;border-radius:12px;margin:8px 0 16px;font-size:0.85rem;color:#0B4F8C;">
                            💡 أو اضغط على زر <strong>"حمل التطبيق"</strong> مرة أخرى بعد التثبيت
                        </div>
                        <button onclick="this.parentElement.parentElement.remove()" style="padding:14px 40px;border-radius:50px;border:none;background:linear-gradient(135deg,#FFD60A,#F59E0B);color:#081B2C;font-weight:700;font-size:1rem;cursor:pointer;font-family:'Cairo',sans-serif;width:100%;transition:transform 0.2s;">
                            ✅ فهمت
                        </button>
                    </div>
                `;
                document.body.appendChild(helpModal);
            }
            
            // ============================================================
            // 7. التحقق الدوري من حالة التثبيت
            // ============================================================
            setInterval(function() {
                if (isAppInstalled()) {
                    if (installBtn && !installBtn.classList.contains('installed')) {
                        installBtn.innerHTML = `
                            <span class="icon">✅</span>
                            <span class="text">تم تثبيت التطبيق</span>
                        `;
                        installBtn.classList.add('installed');
                        installBtn.disabled = true;
                        installBtn.style.cursor = 'default';
                    }
                    deferredPrompt = null;
                }
            }, 3000);
            
            // ============================================================
            // 8. إظهار الزر بشكل افتراضي بعد التحميل
            // ============================================================
            // في حالة عدم وجود beforeinstallprompt (مثل بعض المتصفحات)
            // نظهر الزر مع خيار التثبيت اليدوي
            setTimeout(function() {
                if (installBtn && installBtn.style.display === 'none' && !isAppInstalled()) {
                    installBtn.style.display = 'flex';
                    installBtn.disabled = false;
                    installBtn.innerHTML = `
                        <span class="icon">📲</span>
                        <span class="text">تثبيت التطبيق</span>
                        <span class="badge">📌</span>
                    `;
                }
            }, 3000);
            
            // التحقق الفوري بعد تحميل الصفحة
            setTimeout(checkAndShowInstallButton, 1500);
            
            console.log('🚀 Yalla Chemistry Platform Loader v2.2 - زر التثبيت البارز');
            
        })();
    </script>
</body>
</html>
