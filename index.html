    <style>
        :root {
            --bg: #EAF6FF;
            --card: #FFFFFF;
            --text: #081B2C;
            --text2: #0B4F8C;
            --border: #DCEFFF;
            --primary: #0B4F8C;
            --primary2: #1E81CE;
            --accent: #4CC9F0;
            --gold: #FFD60A;
            --gold-dark: #D4A800;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
            --success: #22C55E;
            --danger: #EF4444;
            --warning: #FFA726;
            --shadow: 0 4px 12px rgba(11, 79, 140, 0.10);
            --radius: 16px;
            --radius-lg: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #F8FAFC;
            --text2: #38BDF8;
            --border: #334155;
            --primary: #38BDF8;
            --primary2: #0EA5E9;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .font-lalezar {
            font-family: 'Lalezar', cursive;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ===== حماية الفيديو المتقدمة ===== */
        .video-protected {
            position: relative;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: #000;
        }

        /* طبقة الحماية الرئيسية */
        .video-blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            cursor: default;
            background: transparent;
            pointer-events: auto;
        }

        /* منع التفاعل مع الفيديو */
        .video-blocker iframe,
        .video-blocker video {
            pointer-events: none !important;
        }

        /* العلامة المائية المتحركة */
        .watermark-moving {
            position: absolute;
            top: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 1.2rem;
            font-weight: 900;
            z-index: 25;
            pointer-events: none;
            font-family: 'Lalezar', cursive;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            white-space: nowrap;
            animation: watermarkMove 35s linear infinite;
            letter-spacing: 3px;
            user-select: none;
            opacity: 0.6;
        }

        .watermark-moving .name {
            color: var(--gold);
            opacity: 0.9;
        }

        @keyframes watermarkMove {
            0% {
                transform: translate(0, 0);
                opacity: 0.3;
            }
            20% {
                transform: translate(calc(100% - 200px), 10px);
                opacity: 0.6;
            }
            40% {
                transform: translate(calc(100% - 200px), calc(100% - 80px));
                opacity: 0.4;
            }
            60% {
                transform: translate(0, calc(100% - 80px));
                opacity: 0.6;
            }
            80% {
                transform: translate(calc(100% - 200px), calc(100% - 80px));
                opacity: 0.4;
            }
            100% {
                transform: translate(0, 0);
                opacity: 0.3;
            }
        }

        /* العلامة المائية الثابتة في الأسفل */
        .video-watermark {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            color: rgba(255, 255, 255, 0.9);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            z-index: 20;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            letter-spacing: 0.5px;
            font-family: 'Cairo', sans-serif;
        }

        .video-watermark span {
            color: var(--gold);
            margin-right: 6px;
        }

        .video-watermark .student-name {
            color: #fff;
            font-weight: 800;
        }

        /* منع النسخ العام */
        .no-copy {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        .no-copy * {
            user-select: none;
            -webkit-user-select: none;
        }

        /* ===== مشغل الفيديو ===== */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: #000;
            aspect-ratio: 16/9;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .video-container .plyr {
            border-radius: var(--radius-lg);
            height: 100%;
        }

        .plyr--video {
            border-radius: var(--radius-lg);
            overflow: hidden;
            height: 100%;
        }

        .plyr__controls {
            direction: ltr;
        }

        .plyr__menu__container {
            direction: rtl;
        }

        .plyr__controls .plyr__control {
            color: #fff !important;
        }
        .plyr__controls .plyr__control:hover {
            background: rgba(255, 255, 255, 0.2) !important;
        }
        .plyr__controls .plyr__control--overlaid {
            background: var(--primary) !important;
        }
        .plyr__controls .plyr__control--overlaid:hover {
            background: var(--primary2) !important;
        }
        .plyr--video .plyr__progress__buffer {
            color: rgba(255, 255, 255, 0.3);
        }
        .plyr--video .plyr__progress__played {
            background: var(--primary) !important;
        }
        .plyr__menu__container .plyr__control--forward {
            padding-right: 24px !important;
        }
        .plyr__menu__container .plyr__control--back {
            padding-right: 24px !important;
        }

        /* منع أي تفاعل خارج عناصر التحكم */
        .plyr__video-wrapper {
            pointer-events: none !important;
        }
        .plyr__video-wrapper video {
            pointer-events: none !important;
        }

        /* ===== باقي التنسيقات ===== */
        .nav-logo img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border: none !important;
            border-radius: 0 !important;
            background: transparent !important;
        }

        .hero-image-container {
            width: 100%;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
            position: relative;
            background: var(--bg);
        }
        .hero-image-container img {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            display: block;
            aspect-ratio: 16/7;
        }
        @media (max-width: 1024px) {
            .hero-image-container img {
                aspect-ratio: 16/8;
                max-height: 400px;
            }
        }
        @media (max-width: 768px) {
            .hero-image-container img {
                max-height: 300px;
                aspect-ratio: 16/9;
            }
        }
        @media (max-width: 480px) {
            .hero-image-container img {
                max-height: 200px;
                aspect-ratio: 16/10;
                object-fit: contain;
                background: var(--bg);
            }
        }

        .skeleton {
            background: linear-gradient(90deg, var(--border) 25%, var(--bg) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius);
        }
        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(11, 79, 140, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: var(--transition);
            padding: 6px 0;
        }
        [data-theme="dark"] .navbar {
            background: rgba(15, 23, 42, 0.9);
            border-bottom-color: rgba(255, 255, 255, 0.05);
        }
        .navbar.scrolled {
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            flex-shrink: 0;
        }
        .nav-logo img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border: none !important;
            border-radius: 0 !important;
            background: transparent !important;
        }
        .nav-logo span {
            font-family: 'Lalezar', cursive;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 3px;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a,
        .nav-links button {
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text2);
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            position: relative;
        }
        .nav-links a:hover,
        .nav-links button:hover {
            background: var(--border);
            color: var(--primary);
            transform: translateY(-1px);
        }
        .nav-links .btn-primary-nav {
            background: var(--primary);
            color: #fff !important;
            padding: 6px 18px;
        }
        .nav-links .btn-primary-nav:hover {
            background: var(--primary2);
            transform: translateY(-1px);
        }

        .theme-toggle {
            width: 32px;
            height: 18px;
            border-radius: 18px;
            background: var(--border);
            border: none;
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .theme-toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
            transition: var(--transition);
        }
        [data-theme="dark"] .theme-toggle {
            background: var(--primary);
        }
        [data-theme="dark"] .theme-toggle::after {
            transform: translateX(-14px);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(11, 79, 140, 0.25);
            font-family: 'Cairo', sans-serif;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(11, 79, 140, 0.35);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
        }
        .btn-outline:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 8px 20px;
            font-size: 0.8rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            height: 100%;
            position: relative;
        }
        .card:hover {
            box-shadow: var(--shadow);
            transform: translateY(-5px);
            border-color: var(--primary);
        }
        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.5s;
            aspect-ratio: 16/9;
            background: var(--bg);
        }
        @media (max-width: 768px) {
            .card-img {
                height: 170px;
            }
        }
        @media (max-width: 480px) {
            .card-img {
                height: 150px;
            }
        }
        .card:hover .card-img {
            transform: scale(1.03);
        }
        .card-body {
            padding: 16px 18px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 14px 32px;
            border-radius: var(--radius);
            font-weight: 600;
            animation: slideUp 0.4s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            font-size: 0.95rem;
            font-family: 'Cairo', sans-serif;
        }
        .toast-success {
            background: var(--success);
            color: #fff;
        }
        .toast-error {
            background: var(--danger);
            color: #fff;
        }
        .toast-info {
            background: var(--primary);
            color: #fff;
        }
        .toast-warning {
            background: var(--warning);
            color: #fff;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            z-index: 9995;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .login-overlay.open {
            display: flex;
        }
        .login-box {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            max-width: 400px;
            width: 92%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
        }

        .lesson-container {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 12px;
            overflow: hidden;
            background: var(--card);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lesson-container:hover {
            border-color: var(--primary);
        }
        .lesson-header {
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 700;
            color: var(--text);
            font-size: 1rem;
            user-select: none;
        }
        .lesson-header:hover {
            background: var(--border);
        }
        .lesson-header .lesson-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            font-size: 0.8rem;
            margin-left: 12px;
            flex-shrink: 0;
        }
        .lesson-header .toggle-icon {
            transition: var(--transition);
            font-size: 0.9rem;
        }
        .lesson-container.open .toggle-icon {
            transform: rotate(180deg);
        }
        .lesson-container.open .lesson-header {
            background: var(--primary);
            color: #fff;
        }
        .lesson-container.open .lesson-header .lesson-num {
            background: #fff;
            color: var(--primary);
        }

        .lesson-body {
            padding: 0 16px 16px;
            display: none;
        }
        .lesson-container.open .lesson-body {
            display: block;
        }

        .lesson-content-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: var(--radius);
            margin-top: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
            cursor: pointer;
            background: var(--card);
            min-height: 56px;
            position: relative;
        }
        .lesson-content-item:hover {
            border-color: var(--primary);
            background: var(--bg);
            transform: translateX(-4px);
        }
        .lesson-content-item.completed-item {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.05);
        }
        .lesson-content-item .item-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #fff;
            font-size: 1.1rem;
        }
        .lesson-content-item .item-icon.video {
            background: #EF4444;
        }
        .lesson-content-item .item-icon.exam {
            background: #F59E0B;
        }
        .lesson-content-item .item-icon.assignment {
            background: #8B5CF6;
        }
        .lesson-content-item .item-icon.quiz {
            background: #22C55E;
        }
        .lesson-content-item .item-icon.pdf {
            background: #DC2626;
        }
        .lesson-content-item .item-text {
            flex: 1;
        }
        .lesson-content-item .item-text .title {
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
        }
        .lesson-content-item .item-text .sub {
            font-size: 0.7rem;
            color: var(--text2);
        }
        .completed-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--success);
            color: #fff;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--primary), var(--primary2));
            transition: width 0.6s ease;
        }

        .grid-courses {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .back-top {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            cursor: pointer;
            z-index: 99;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 16px rgba(11, 79, 140, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .back-top:hover {
            transform: translateY(-3px);

        @media (max-width: 768px) {

</head>
<body>

    <!-- ====== NAVBAR ====== -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">

    <!-- ====== MAIN CONTENT ====== -->
    <main id="mainContent"></main>

    <!-- ====== FOOTER ====== -->
    <footer style="background:var(--card);border-top:1px solid var(--border);padding:20px;margin-top:16px;">
        <div style="max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;">
            <div style="display:flex;align-items:center;gap:10px;">
                <img src="https://res.cloudinary.com/dbahe7lxz/image/upload/v1785593692/idraaak/ogvolfsxxnvk24gho8eb.jpg" alt="يلا كيمياء" style="width:32px;height:32px;object-fit:contain;border:none;border-radius:0;background:transparent;" loading="lazy">
                <span style="font-family:'Lalezar',cursive;font-size:1.2rem;color:var(--primary);">يلا كيمياء</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:12px;font-size:0.85rem;">
                <a href="#" onclick="APP.showHome()" style="color:var(--text2);text-decoration:none;transition:var(--transition);">الرئيسية</a>
                <a href="login.html" style="color:var(--text2);text-decoration:none;transition:var(--transition);">تسجيل الدخول</a>
                <a href="#" onclick="APP.showPrivacy()" style="color:var(--text2);text-decoration:none;transition:var(--transition);">سياسة الخصوصية</a>
                <a href="#" onclick="APP.showTerms()" style="color:var(--text2);text-decoration:none;transition:var(--transition);">الشروط والأحكام</a>
            </div>
            <p style="font-size:0.75rem;color:var(--text2);">جميع الحقوق محفوظة © يلا كيمياء 2026</p>
        </div>
    </footer>

    <script>
        // ============================================================
        // 🔒 ANTI-DEBUGGING & SECURITY - الطبقة الأولى
        // ============================================================
        (function() {
            'use strict';

            // تعطيل الكونسول
            const noop = () => {};
            const consoleMethods = ['log', 'info', 'warn', 'error', 'debug', 'trace', 'dir', 'dirxml', 'group', 'groupEnd',
                'time', 'timeEnd', 'count', 'assert', 'profile', 'profileEnd'
            ];
            consoleMethods.forEach(method => {
                console[method] = noop;
            });

            // منع F12 و Ctrl+Shift+I/J/C و Ctrl+U
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
                    (e.ctrlKey && e.key === 'U')) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            });

            // منع النقر بزر الماوس الأيمن في كل الصفحة
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            });

            // منع النسخ في كل الصفحة
            document.addEventListener('copy', function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            });

            document.addEventListener('paste', function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            });

            document.addEventListener('cut', function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            });

            console.log('🔒 Security layer 1 activated');
        })();

        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBOBu3wp3GcA-VjwtqIt1PAYYpo_HXFhtU",
            authDomain: "yalla-kimya.firebaseapp.com",
            databaseURL: "https://yalla-kimya-default-rtdb.firebaseio.com",
            projectId: "yalla-kimya",
            storageBucket: "yalla-kimya.firebasestorage.app",
            messagingSenderId: "1052374689829",
            appId: "1:1052374689829:web:fbb815ab42d753e63377cc",
            measurementId: "G-B3SJFF8R1R"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const storage = firebase.storage();
        const auth = firebase.auth();
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        // ============================================================
        // APP STATE
        // ============================================================
        let currentUser = null;
        let userData = null;
        let allCourses = [];
        let userSubscriptions = [];
        let userCourseProgress = {};
        let allLessons = [];
        let activeVideoLessonId = null;
        let videoWatchStartTime = null;
        let videoWatchTotal = {};
        let activePlyrInstance = null;

        const APP_URL = 'https://yaiakamya.vercel.app/';
        const HERO_IMAGE =
            'https://res.cloudinary.com/dbahe7lxz/image/upload/v1785593596/idraaak/x0xgxrk0kkxxgn73npal.png';
        const LOGO_IMAGE =
            'https://res.cloudinary.com/dbahe7lxz/image/upload/v1785593692/idraaak/ogvolfsxxnvk24gho8eb.jpg';

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showToast(msg, type = 'success') {
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = msg;
            document.getElementById('toastContainer').appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }

        function animateAtoms(elementId, target) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const start = parseInt(el.textContent) || 0;
            const duration = 600;
            const startTime = Date.now();

            function update() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const current = Math.floor(start + (target - start) * progress);
                el.textContent = current;
                if (progress < 1) requestAnimationFrame(update);
                else el.textContent = target;
            }
            update();
        }

        function extractYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function isPremiumCourse(courseId) {
            if (!currentUser || !userData) return false;
            return userData.premiumCourses && userData.premiumCourses[courseId] === true;
        }

        // ============================================================
        // THEME
        // ============================================================
        function applyTheme(isDark) {
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            applyTheme(!isDark);
        }
        if (localStorage.getItem('theme') === 'dark') applyTheme(true);

        // ============================================================
        // AUTH
        // ============================================================
        function showLoginOverlay() {
            document.getElementById('loginOverlay').classList.add('open');
        }

        function closeLoginOverlay() {
            document.getElementById('loginOverlay').classList.remove('open');
        }

        // ============================================================
        // COURSES & LESSONS
        // ============================================================
        function loadCourses() {
            database.ref('courses').once('value', (snapshot) => {
                allCourses = [];
                snapshot.forEach((child) => {
                    const data = child.val();
                    allCourses.push({ id: child.key, ...data, studentsCount: data.studentsCount || data
                            .students || 0, lessonsCount: data.lessonsCount || data.lessons || 0 });
                });
                allCourses.sort((a, b) => (a.order || 0) - (b.order || 0));
                renderCourses(allCourses);
            });
        }

        function loadLessons() {
            database.ref('lessons').once('value', (snapshot) => {
                allLessons = [];
                snapshot.forEach((child) => {
                    const data = child.val();
                    allLessons.push({ id: child.key, ...data });
                });
            });
        }

        function loadUserSubscriptions(uid) {
            database.ref('courseSubscriptions').orderByChild('userId').equalTo(uid).once('value', (snapshot) => {
                userSubscriptions = [];
                snapshot.forEach((child) => {
                    const data = child.val();
                    userSubscriptions.push({ id: child.key, ...data });
                });
                renderCourses(allCourses);
            });
        }

        function loadUserProgress(uid) {
            database.ref('users/' + uid + '/progress').once('value', (snapshot) => {
                if (snapshot.exists()) {
                    userCourseProgress = snapshot.val();
                } else {
                    userCourseProgress = {};
                }
            });
        }

        function isUserSubscribed(courseId) {
            if (isPremiumCourse(courseId)) return true;
            return userSubscriptions.some(sub => sub.courseId === courseId && sub.status === 'active');
        }

        async function subscribeToCourse(courseId) {
            if (!currentUser) { showLoginOverlay(); return; }
            const course = allCourses.find(c => c.id === courseId);
            if (!course) { showToast('⚠️ الكورس غير موجود', 'error'); return; }
            if (course.isFree !== false) {
                if (isUserSubscribed(courseId)) { showToast('✅ أنت مشترك بالفعل', 'info'); return; }
                try {
                    await database.ref('users/' + currentUser.uid + '/premiumCourses/' + courseId).set(true);
                    if (userData) {
                        if (!userData.premiumCourses) userData.premiumCourses = {};
                        userData.premiumCourses[courseId] = true;
                    }
                    showToast('🎉 تم الاشتراك في الكورس بنجاح!', 'success');
                    renderCourses(allCourses);
                } catch (err) {
                    console.error('Subscription error:', err);
                    showToast('❌ حدث خطأ أثناء الاشتراك', 'error');
                }
            } else {
                showToast('💰 هذا الكورس مدفوع، تواصل مع الدعم', 'warning');
            }
        }

        // ============================================================
        // RENDER COURSES
        // ============================================================
        function renderCourses(courses) {
            const grid = document.getElementById('coursesGrid');
            if (!grid) return;
            if (!courses || courses.length === 0) {
                grid.innerHTML =
                    `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">📚</div><h3>لا توجد كورسات متاحة حالياً</h3><p>سيتم إضافة الكورسات قريباً</p></div>`;
                return;
            }
            grid.innerHTML = courses.map(c => {
                const subscribed = currentUser ? isUserSubscribed(c.id) : false;
                const isLocked = !currentUser || (!subscribed && c.isFree === false);
                const isFree = c.isFree !== false;
                const priceDisplay = isFree ? 'مجاني' : (c.price || 'مدفوع');

                return `
                    <div class="card" style="cursor:pointer;position:relative;" onclick="${isLocked ? `APP.showLoginOverlay()` : `APP.openCoursePage('${c.id}')`}">
                        <div style="position:relative;overflow:hidden;">
                            <img src="${c.image || 'https://placehold.co/600x400/1a1f2e/0B4F8C?text=كورس'}" alt="${escapeHtml(c.title) || 'كورس'}" class="card-img" loading="lazy" onerror="this.src='https://placehold.co/600x400/1a1f2e/0B4F8C?text=كورس'">
                            <div style="position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:2;flex-wrap:wrap;">
                                <span style="font-size:0.8rem;padding:4px 16px;border-radius:50px;background:${isFree ? 'var(--success)' : 'var(--gold)'};color:${isFree ? '#fff' : '#081B2C'};font-weight:700;">${isFree ? '🆓 مجاني' : '💰 مدفوع'}</span>
                                ${isLocked ? '<span style="font-size:0.8rem;padding:4px 16px;border-radius:50px;background:rgba(0,0,0,0.7);color:#fff;font-weight:700;">🔒</span>' : ''}
                            </div>
                            ${isLocked ? `<div class="lock-overlay"><span class="lock-text">🔒 هذا الكورس مدفوع</span></div>` : ''}
                        </div>
                        <div class="card-body">
                            <h3 style="font-weight:800;font-size:1.2rem;color:var(--text);margin-bottom:4px;">${escapeHtml(c.title) || 'كورس'}</h3>
                            <p style="font-size:0.85rem;color:var(--text2);margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${escapeHtml(c.description) || ''}</p>
                            <div style="display:flex;flex-wrap:wrap;gap:4px 10px;font-size:0.7rem;color:var(--text2);margin-bottom:8px;border-top:1px solid var(--border);padding-top:6px;">
                                <span>🎯 ${c.grade || 'كل الصفوف'}</span>
                                <span>📚 ${c.lessonsCount || 0} حصة</span>
                                ${!isFree ? `<span style="font-weight:700;color:var(--gold-dark);">💰 ${escapeHtml(priceDisplay)}</span>` : ''}
                            </div>
                            ${currentUser ? `
                                ${subscribed ? `
                                    <button class="btn-primary" style="width:100%;justify-content:center;font-size:0.8rem;padding:6px 12px;" onclick="event.stopPropagation(); APP.openCoursePage('${c.id}')">
                                        📖 متابعة
                                    </button>
                                ` : `
                                    <button class="btn-primary" style="width:100%;justify-content:center;font-size:0.8rem;padding:6px 12px;" onclick="event.stopPropagation(); APP.subscribeToCourse('${c.id}')">
                                        ${isFree ? '📝 اشترك الآن' : '💰 اشترِ الآن'}
                                    </button>
                                `}
                            ` : `
                                <button class="btn-primary" style="width:100%;justify-content:center;font-size:0.8rem;padding:6px 12px;" onclick="event.stopPropagation(); APP.showLoginOverlay()">
                                    🔒 اشترك الآن
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        // OPEN COURSE PAGE
        // ============================================================
        async function openCoursePage(courseId) {
            if (!currentUser) { showLoginOverlay(); return; }

            const main = document.getElementById('mainContent');
            if (!main) return;

            const course = allCourses.find(c => c.id === courseId);
            if (!course) { showToast('الكورس غير موجود', 'error'); return; }

            // التحقق من الاشتراك
            if (course.isFree === false && !isPremiumCourse(courseId)) {
                showToast('💰 هذا الكورس مدفوع، يرجى الاشتراك أولاً', 'warning');
                return;
            }

            main.innerHTML =
                `<div style="max-width:1280px;margin:0 auto;padding:20px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div><p style="margin-top:12px;color:var(--text2);font-weight:600;">جارٍ تجهيز المحتوى...</p></div>`;
            window.scrollTo({ top: 0, behavior: 'smooth' });

            try {
                const lessons = allLessons.filter(l => l.courseId === courseId);
                lessons.sort((a, b) => (a.order || 0) - (b.order || 0));

                let completedCount = 0;
                let totalAtoms = 0;
                lessons.forEach(l => {
                    if (userCourseProgress[l.id]?.watched) completedCount++;
                    totalAtoms += (l.atomsReward || 5);
                });
                const progressPercent = lessons.length > 0 ? Math.round((completedCount / lessons.length) * 100) : 0;

                let lessonsHtml = lessons.map((lesson, idx) => {
                    const isCompleted = userCourseProgress[lesson.id]?.watched || false;
                    const statusText = isCompleted ? '✅ مكتملة' : '⏳ قيد التقدم';

                    let contentItems = [];
                    if (lesson.videoUrl) {
                        contentItems.push({
                            type: 'video',
                            icon: 'video',
                            iconClass: 'video',
                            title: '▶ مشاهدة الشرح',
                            action: `APP.openLessonVideo('${lesson.id}')`,
                            completed: isCompleted
                        });
                    }
                    if (lesson.pdfUrl) {
                        contentItems.push({
                            type: 'pdf',
                            icon: 'pdf',
                            iconClass: 'pdf',
                            title: '📄 تحميل الملزمة',
                            action: `window.open('${lesson.pdfUrl}','_blank')`,
                            completed: false
                        });
                    }

                    const contentHtml = contentItems.length > 0 ? `
                        <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">
                            ${contentItems.map(item => `
                                <div class="lesson-content-item ${item.completed ? 'completed-item' : ''}" onclick="${item.action}">
                                    <div class="item-icon ${item.iconClass}"><i class="fas fa-${item.icon === 'video' ? 'play' : item.icon === 'pdf' ? 'file-pdf' : item.icon === 'assignment' ? 'tasks' : item.icon === 'quiz' ? 'puzzle-piece' : 'file-alt'}"></i></div>
                                    <div class="item-text"><div class="title">${item.title}</div></div>
                                    ${item.completed ? '<span class="completed-badge">✅ مكتمل</span>' : ''}
                                    <i class="fas fa-chevron-left" style="color:var(--text2);font-size:0.7rem;"></i>
                                </div>
                            `).join('')}
                        </div>
                    ` : '';

                    return `
                        <div class="lesson-container">
                            <div class="lesson-header" onclick="this.parentElement.classList.toggle('open')">
                                <div style="display:flex;align-items:center;">
                                    <span class="lesson-num">${idx + 1}</span>
                                    <span>${escapeHtml(lesson.title)}</span>
                                    <span style="font-size:0.7rem;color:var(--text2);margin-right:8px;">${statusText}</span>
                                </div>
                                <div style="display:flex;align-items:center;gap:8px;">
                                    <span style="font-size:0.7rem;color:var(--text2);">⭐ ${lesson.atomsReward || 5}</span>
                                    <span class="toggle-icon"><i class="fas fa-chevron-down"></i></span>
                                </div>
                            </div>
                            <div class="lesson-body">
                                ${contentHtml || '<div style="margin-top:12px;color:var(--text2);font-size:0.85rem;text-align:center;">لا يوجد محتوى لهذه الحصة</div>'}
                            </div>
                        </div>
                    `;
                }).join('');

                main.innerHTML = `
                    <div style="max-width:1280px;margin:0 auto;padding:20px;">
                        <button class="btn-outline btn-sm no-print" onclick="APP.showHome()"><i class="fas fa-arrow-right"></i> العودة</button>
                        <div class="course-page-hero" style="margin-top:12px;background:linear-gradient(135deg, var(--primary), var(--primary2));padding:30px;border-radius:var(--radius-lg);color:#fff;">
                            <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;">
                                ${course.image ? `<img src="${course.image}" alt="${escapeHtml(course.title)}" style="width:120px;height:120px;border-radius:var(--radius);object-fit:cover;border:3px solid rgba(255,255,255,0.3);" loading="lazy">` : ''}
                                <div style="flex:1;">
                                    <h1 style="font-size:2rem;font-family:'Lalezar',cursive;">${escapeHtml(course.title)}</h1>
                                    <p style="font-size:1rem;opacity:0.9;">${escapeHtml(course.description) || ''}</p>
                                    <div class="stats" style="display:flex;gap:24px;margin-top:12px;flex-wrap:wrap;">
                                        <span><i class="fas fa-video"></i> ${lessons.length} حصة</span>
                                        <span><i class="fas fa-atom"></i> ${totalAtoms} ذرة</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div style="margin-bottom:16px;">
                            <div style="display:flex;justify-content:space-between;font-size:0.9rem;margin-bottom:4px;">
                                <span style="color:var(--text2);">نسبة الإكمال</span>
                                <span style="color:var(--primary);font-weight:700;">${progressPercent}%</span>
                            </div>
                            <div class="progress-bar"><div class="fill" style="width:${progressPercent}%;"></div></div>
                        </div>
                        <h3 style="font-weight:700;font-size:1.2rem;color:var(--primary);margin-bottom:12px;">📚 قائمة الحصص</h3>
                        ${lessonsHtml || '<div class="empty-state"><div class="icon">📚</div><h3>لا توجد حصص</h3></div>'}
                    </div>
                `;
            } catch (error) {
                console.error('openCoursePage error:', error);
                main.innerHTML = `
                    <div style="max-width:1280px;margin:0 auto;padding:20px;text-align:center;">
                        <div style="font-size:3rem;margin-bottom:12px;">⚠️</div>
                        <h3 style="font-weight:700;color:var(--text);">حدث خطأ في تحميل الكورس</h3>
                        <button class="btn-primary no-print" style="margin-top:12px;" onclick="APP.showHome()">🏠 العودة</button>
                    </div>
                `;
            }
        }

        // ============================================================
        // 🎥 OPEN LESSON VIDEO - محمي بالكامل
        // ============================================================
        async function openLessonVideo(lessonId) {
            // ===== التحقق من تسجيل الدخول =====
            if (!currentUser) {
                showLoginOverlay();
                return;
            }

            // ===== التحقق من اكتمال المشاهدة =====
            if (userCourseProgress[lessonId]?.watched) {
                showToast('✅ لقد أكملت مشاهدة هذه الحصة بالفعل', 'info');
                return;
            }

            const main = document.getElementById('mainContent');
            if (!main) return;

            try {
                const snapshot = await database.ref('lessons/' + lessonId).once('value');
                if (!snapshot.exists()) {
                    showToast('الحصة غير موجودة', 'error');
                    return;
                }
                const lesson = snapshot.val();

                // ===== التحقق من صلاحية الكورس =====
                const course = allCourses.find(c => c.id === lesson.courseId);
                if (course && course.isFree === false && !isPremiumCourse(course.id)) {
                    showToast('💰 هذا الكورس مدفوع، يرجى الاشتراك أولاً', 'warning');
                    return;
                }

                const videoIdYt = extractYouTubeId(lesson.videoUrl || '');
                if (!videoIdYt) {
                    showToast('⚠️ لا يوجد فيديو لهذه الحصة', 'warning');
                    return;
                }

                // ===== رابط الفيديو المحمي =====
                const videoUrl =
                    `https://www.youtube.com/embed/${videoIdYt}?enablejsapi=1&rel=0&modestbranding=1&controls=1&showinfo=0&fs=0&iv_load_policy=3&cc_load_policy=0&disablekb=1`;

                // تنظيف التتبع السابق
                clearVideoTracking();
                activeVideoLessonId = lessonId;
                videoWatchStartTime = Date.now();
                if (!videoWatchTotal[lessonId]) videoWatchTotal[lessonId] = 0;

                // ===== اسم الطالب للعلامة المائية =====
                const studentName = userData?.name || 'طالب';

                // ===== عرض صفحة الفيديو =====
                main.innerHTML = `
                    <div style="max-width:1100px;margin:0 auto;padding:16px;" class="no-copy">
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:0.85rem;color:var(--text2);flex-wrap:wrap;">
                            <button class="btn-outline btn-sm no-print" onclick="APP.openCoursePage('${lesson.courseId}')" style="padding:4px 12px;">
                                <i class="fas fa-arrow-right"></i> ${escapeHtml(course ? course.title : 'الكورس')}
                            </button>
                            <span style="color:var(--border);">/</span>
                            <span style="font-weight:600;color:var(--text);">${escapeHtml(lesson.title)}</span>
                        </div>
                        <h1 style="font-family:'Lalezar',cursive;font-size:clamp(1.3rem,2.5vw,2rem);color:var(--text);margin-bottom:12px;">🎥 ${escapeHtml(lesson.title)}</h1>
                        
                        <!-- ===== حاوية الفيديو المحمية بالكامل ===== -->
                        <div style="position:relative;border-radius:var(--radius-lg);overflow:hidden;background:#000;aspect-ratio:16/9;">
                            
                            <!-- مشغل الفيديو -->
                            <div class="video-container" id="videoContainer">
                                <video id="player" playsinline controls crossorigin>
                                    <source src="${videoUrl}" type="video/mp4">
                                    <p>⚠️ متصفحك لا يدعم تشغيل الفيديو.</p>
                                </video>
                            </div>
                            
                            <!-- ===== طبقة الحماية: تمنع أي تفاعل مع الفيديو ===== -->
                            <div class="video-blocker" 
                                 style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:15;cursor:default;background:transparent;pointer-events:auto;"
                                 onclick="event.preventDefault(); event.stopPropagation(); return false;"
                                 oncontextmenu="event.preventDefault(); event.stopPropagation(); return false;"
                                 onmousedown="event.preventDefault(); event.stopPropagation(); return false;"
                                 onmouseup="event.preventDefault(); event.stopPropagation(); return false;"
                                 ondblclick="event.preventDefault(); event.stopPropagation(); return false;">
                            </div>
                            
                            <!-- ===== العلامة المائية المتحركة ===== -->
                            <div class="watermark-moving">
                                🧪 <span class="name">${escapeHtml(studentName)}</span> | يلا كيمياء
                            </div>
                            
                            <!-- ===== العلامة المائية الثابتة ===== -->
                            <div class="video-watermark">
                                🔒 <span>يلا كيمياء</span> | <span class="student-name">${escapeHtml(studentName)}</span>
                            </div>
                        </div>
                        
                        <!-- ===== أزرار التحكم ===== -->
                        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">
                            <button class="btn-outline btn-sm no-print" onclick="APP.handleVideoExit('${lessonId}')">📚 العودة للكورس</button>
                            <button class="btn-outline btn-sm no-print" onclick="APP.showHome()">🏠 الرئيسية</button>
                        </div>
                        <p style="text-align:center;font-size:0.7rem;color:var(--text2);margin-top:12px;">
                            🔒 هذا المحتوى محمي بحقوق النشر - ممنوع النسخ أو المشاركة
                        </p>
                    </div>
                `;
                window.scrollTo({ top: 0, behavior: 'smooth' });

                // ===== تهيئة مشغل Plyr مع تحكم كامل =====
                setTimeout(() => {
                    const playerElement = document.getElementById('player');
                    if (!playerElement) return;

                    // ===== إنشاء مشغل Plyr =====
                    const plyr = new Plyr(playerElement, {
                        controls: [
                            'play-large', 'play', 'progress', 'current-time',
                            'duration', 'mute', 'volume', 'captions',
                            'settings', 'pip', 'fullscreen'
                        ],
                        settings: ['quality', 'speed'],
                        quality: {
                            default: 720,
                            options: [1080, 720, 480, 360]
                        },
                        speed: {
                            selected: 1,
                            options: [0.5, 0.75, 1, 1.25, 1.5, 2]
                        },
                        i18n: {
                            play: 'تشغيل',
                            pause: 'إيقاف مؤقت',
                            restart: 'إعادة التشغيل',
                            seek: 'البحث',
                            played: 'تم التشغيل',
                            buffered: 'تم التحميل',
                            currentTime: 'الوقت الحالي',
                            duration: 'المدة',
                            volume: 'مستوى الصوت',
                            mute: 'كتم الصوت',
                            unmute: 'إلغاء الكتم',
                            settings: 'الإعدادات',
                            pip: 'صورة داخل صورة',
                            fullscreen: 'ملء الشاشة',
                            speed: 'السرعة',
                            quality: 'الجودة',
                            captions: 'الترجمة',
                            enableCaptions: 'تفعيل الترجمة',
                            disableCaptions: 'إلغاء الترجمة',
                        },
                        mediaMetadata: {
                            title: lesson.title || 'فيديو تعليمي',
                            artist: 'يلا كيمياء',
                            album: course ? course.title : 'كورس كيمياء'
                        }
                    });

                    activePlyrInstance = plyr;

                    // ===== تتبع تقدم المشاهدة =====
                    let lastLoggedProgress = 0;

                    plyr.on('timeupdate', () => {
                        if (!currentUser || !activeVideoLessonId) return;
                        const currentTime = plyr.currentTime;
                        const duration = plyr.duration || 1;
                        const progress = (currentTime / duration) * 100;

                        // تسجيل التقدم كل 10%
                        const progressRounded = Math.floor(progress / 10) * 10;
                        if (progressRounded > lastLoggedProgress && progressRounded <= 90) {
                            lastLoggedProgress = progressRounded;
                            database.ref(`users/${currentUser.uid}/progress/${lessonId}/watchPercent`)
                                .set(progressRounded);
                            database.ref(`users/${currentUser.uid}/progress/${lessonId}/lastPosition`)
                                .set(currentTime);
                        }

                        // عند الوصول لـ 90% تعتبر الحصة مكتملة
                        if (progress >= 90 && !userCourseProgress[lessonId]?.watched) {
                            completeLessonWatch(lessonId);
                            plyr.off('timeupdate');
                        }
                    });

                    // عند انتهاء الفيديو
                    plyr.on('ended', () => {
                        if (!userCourseProgress[lessonId]?.watched) {
                            completeLessonWatch(lessonId);
                        }
                    });

                    // ===== حماية إضافية: منع النسخ والسحب =====
                    const videoElement = playerElement;

                    videoElement.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        return false;
                    });

                    videoElement.addEventListener('dragstart', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        return false;
                    });

                    videoElement.addEventListener('copy', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        return false;
                    });

                    // منع فتح الفيديو في تبويب جديد
                    document.querySelectorAll('.video-container a, .video-container button').forEach(el => {
                        el.addEventListener('click', (e) => {
                            if (e.ctrlKey || e.metaKey) {
                                e.preventDefault();
                                e.stopPropagation();
                                showToast('⛔ لا يمكن فتح المحتوى خارج المنصة', 'warning');
                                return false;
                            }
                        });
                    });

                }, 500);

            } catch (error) {
                console.error('openLessonVideo error:', error);
                showToast('حدث خطأ في تحميل الفيديو', 'error');
                showHome();
            }
        }

        // ============================================================
        // ✅ COMPLETE LESSON WATCH
        // ============================================================
        async function completeLessonWatch(lessonId) {
            try {
                if (userCourseProgress[lessonId]?.watched) return;

                const lesson = allLessons.find(l => l.id === lessonId);
                if (!lesson) return;

                const atomsReward = lesson.atomsReward || 5;
                const userRef = database.ref('users/' + currentUser.uid);
                const userSnap = await userRef.once('value');

                if (userSnap.exists()) {
                    const currentAtoms = userSnap.val().atoms || 0;

                    await database.ref('users/' + currentUser.uid + '/progress/' + lessonId).set({
                        watched: true,
                        watchPercent: 100,
                        completedAt: new Date().toISOString(),
                        lastPosition: 0,
                        type: 'lesson'
                    });

                    await userRef.update({
                        atoms: currentAtoms + atomsReward,
                        videosWatched: (userSnap.val().videosWatched || 0) + 1,
                        lessonsCompleted: (userSnap.val().lessonsCompleted || 0) + 1,
                        lastStudyDate: new Date().toDateString()
                    });

                    if (userData) {
                        userData.atoms = currentAtoms + atomsReward;
                        userData.videosWatched = (userData.videosWatched || 0) + 1;
                        userData.lessonsCompleted = (userData.lessonsCompleted || 0) + 1;
                    }

                    showToast(`🎉 +${atomsReward} ذرة! (أكملت مشاهدة ${lesson.title})`, 'success');
                    loadUserProgress(currentUser.uid);
                }
            } catch (err) {
                console.error('Error completing lesson watch:', err);
            }
        }

        // ============================================================
        // 🚪 HANDLE VIDEO EXIT
        // ============================================================
        function handleVideoExit(lessonId) {
            clearVideoTracking();
            const lesson = allLessons.find(l => l.id === lessonId);
            if (lesson) {
                openCoursePage(lesson.courseId);
            } else {
                showHome();
            }
        }

        function clearVideoTracking() {
            if (activeVideoLessonId && videoWatchStartTime) {
                const elapsed = (Date.now() - videoWatchStartTime) / 1000;
                if (elapsed > 5) {
                    videoWatchTotal[activeVideoLessonId] = (videoWatchTotal[activeVideoLessonId] || 0) + elapsed;
                }
            }
            activeVideoLessonId = null;
            videoWatchStartTime = null;
            if (activePlyrInstance) {
                try {
                    activePlyrInstance.destroy();
                } catch (e) {}
                activePlyrInstance = null;
            }
        }

        // ============================================================
        // 🏠 HOME PAGE
        // ============================================================
        function showHome() {
            const main = document.getElementById('mainContent');
            if (!main) return;
            const isUser = currentUser !== null;

            main.innerHTML = `
                <section style="padding:40px 20px 20px;max-width:1280px;margin:0 auto;">
                    <div class="hero-image-container">
                        <img src="${HERO_IMAGE}" alt="مستر زياد مبروك" loading="eager" fetchpriority="high" onerror="this.style.display='none'">
                    </div>
                    
                    <div style="text-align:center;">
                        <h1 style="font-family:'Lalezar',cursive;font-size:clamp(2rem,5vw,3.5rem);color:var(--text);margin-bottom:12px;">ابدأ صح… وخلّي الكيمياء تبقى لعبتك 🔥</h1>
                        <p style="font-size:clamp(1rem,1.5vw,1.2rem);color:var(--text2);max-width:600px;margin:0 auto 20px;font-weight:600;">مهما كان مستواك، هنا هتبدأ من الأول خالص… وهتمشي خطوة خطوة لحد ما توصل للفهم الحقيقي 💪</p>
                        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                            ${isUser ? `
                                <button class="btn-primary" onclick="APP.scrollToCourses()">📚 كورساتي</button>
                            ` : `
                                <a href="login.html" class="btn-primary">🚀 ابدأ التعلم الآن</a>
                                <a href="login.html" class="btn-outline">⚪ سجل دخول</a>
                            `}
                        </div>
                    </div>
                </section>

                <section id="coursesSection" style="max-width:1280px;margin:0 auto;padding:0 20px 32px;">
                    <h2 style="font-family:'Lalezar',cursive;font-size:clamp(1.5rem,2.5vw,2.5rem);text-align:center;color:var(--text);margin-bottom:4px;">📚 الكورسات المتاحة</h2>
                    <p style="text-align:center;color:var(--text2);margin-bottom:12px;">اختر صفك الدراسي وابدأ التعلم</p>
                    <div class="grid-courses" id="coursesGrid">
                        <div class="card skeleton" style="height:320px;"></div>
                        <div class="card skeleton" style="height:320px;"></div>
                        <div class="card skeleton" style="height:320px;"></div>
                    </div>
                </section>

                ${!isUser ? `
                    <section style="max-width:1280px;margin:0 auto;padding:0 20px 32px;">
                        <div class="card" style="padding:32px 24px;text-align:center;">
                            <h2 style="font-family:'Lalezar',cursive;font-size:clamp(1.5rem,3vw,2.5rem);color:var(--text);margin-bottom:8px;">🚀 ابدأ رحلتك الآن</h2>
                            <p style="color:var(--text2);margin-bottom:20px;max-width:500px;margin-left:auto;margin-right:auto;">انضم إلى آلاف الطلاب الذين بدأوا رحلتهم في الكيمياء مع مستر زياد مبروك</p>
                            <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;">
                                <a href="login.html" class="btn-primary">✨ إنشاء حساب مجاناً</a>
                                <a href="login.html" class="btn-outline">🔑 تسجيل الدخول</a>
                            </div>
                        </div>
                    </section>
                ` : ''}
            `;
            loadCourses();
            loadLessons();
        }

        function scrollToCourses() {
            const section = document.getElementById('coursesSection');
            if (section) {
                section.scrollIntoView({ behavior: 'smooth' });
            } else {
                showHome();
                setTimeout(() => {
                    const sec = document.getElementById('coursesSection');
                    if (sec) sec.scrollIntoView({ behavior: 'smooth' });
                }, 500);
            }
        }

        function showPrivacy() {
            const main = document.getElementById('mainContent');
            if (!main) return;
            main.innerHTML =
                `<div style="max-width:800px;margin:0 auto;padding:20px;"><button class="btn-outline btn-sm no-print" onclick="APP.showHome()"><i class="fas fa-arrow-right"></i> العودة</button><h1 style="font-family:'Lalezar',cursive;font-size:2rem;color:var(--text);margin:12px 0;">🔒 سياسة الخصوصية</h1><div class="card" style="padding:24px;line-height:2;"><p>نحن في منصة يلا كيمياء نلتزم بحماية خصوصية بياناتك الشخصية.</p><p style="color:var(--text2);font-size:0.9rem;">آخر تحديث: ${new Date().toLocaleDateString('ar')}</p></div></div>`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showTerms() {
            const main = document.getElementById('mainContent');
            if (!main) return;
            main.innerHTML =
                `<div style="max-width:800px;margin:0 auto;padding:20px;"><button class="btn-outline btn-sm no-print" onclick="APP.showHome()"><i class="fas fa-arrow-right"></i> العودة</button><h1 style="font-family:'Lalezar',cursive;font-size:2rem;color:var(--text);margin:12px 0;">📜 الشروط والأحكام</h1><div class="card" style="padding:24px;line-height:2;"><p><strong>1. استخدام المنصة</strong></p><p>• المنصة مخصصة للأغراض التعليمية فقط.</p><p><strong>2. الحسابات</strong></p><p>• كل طالب لديه حساب شخصي واحد فقط.</p><p><strong>3. المحتوى</strong></p><p>• جميع المواد التعليمية محمية بحقوق النشر.</p><p style="color:var(--text2);font-size:0.9rem;">آخر تحديث: ${new Date().toLocaleDateString('ar')}</p></div></div>`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        // SETUP SCROLL HANDLERS
        // ============================================================
        function setupScrollHandlers() {
            const backBtn = document.getElementById('backTop');
            const navbar = document.getElementById('navbar');
            window.addEventListener('scroll', () => {
                const scrollY = window.scrollY;
                if (backBtn) backBtn.style.display = scrollY > 500 ? 'flex' : 'none';
                if (navbar) navbar.classList.toggle('scrolled', scrollY > 50);
            });
        }

        // ============================================================
        // AUTH STATE
        // ============================================================
        auth.onAuthStateChanged((user) => {
            currentUser = user;
            if (user) {
                database.ref('users/' + user.uid).once('value', (snapshot) => {
                    if (snapshot.exists()) {
                        userData = snapshot.val();
                    } else {
                        // إنشاء مستخدم جديد
                        const newUser = {
                            name: 'مستخدم',
                            email: user.email || '',
                            grade: '',
                            atoms: 0,
                            progress: 0,
                            photoURL: '',
                            createdAt: new Date().toISOString(),
                            premiumCourses: {}
                        };
                        database.ref('users/' + user.uid).set(newUser);
                        userData = newUser;
                    }
                    loadUserSubscriptions(user.uid);
                    loadUserProgress(user.uid);
                });
                loadCourses();
                loadLessons();
            } else {
                userData = null;
                loadCourses();
                loadLessons();
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            setupScrollHandlers();
            showHome();
            console.log('🚀 Yalla Chemistry Platform v4.0 - SECURE EDITION');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // ============================================================
        // APP OBJECT
        // ============================================================
        const APP = {
            toggleTheme,
            showHome,
            scrollToCourses,
            closeLoginOverlay,
            showLoginOverlay,
            showPrivacy,
            showTerms,
            openCoursePage,
            openLessonVideo,
            handleVideoExit,
            subscribeToCourse
        };

        window.APP = APP;
    </script>

</body>
