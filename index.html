<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0B4F8C">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dbahe7lxz/image/upload/v1785593692/idraaak/ogvolfsxxnvk24gho8eb.jpg">
    <title>يلا كيمياء</title>
    
    <!-- 🔒 حماية فورية -->
    <script>
        (function() {
            'use strict';
            
            if (window.location.href.includes('view-source')) {
                window.location.href = window.location.href.replace('view-source:', '');
            }
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12' || 
                    (e.ctrlKey && (e.key === 'u' || e.key === 'U')) ||
                    (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c'))) {
                    e.preventDefault();
                    alert('🚫 غير مسموح');
                    return false;
                }
                
                if (e.ctrlKey && (e.key === 't' || e.key === 'T' || e.key === 'n' || e.key === 'N')) {
                    e.preventDefault();
                    alert('🚫 غير مسموح');
                    return false;
                }
            });
            
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                alert('🚫 النقر الأيمن غير مسموح');
                return false;
            });
            
            var noop = function() {};
            var methods = ['log', 'info', 'warn', 'error', 'debug', 'trace', 'dir', 'dirxml', 'group', 'groupEnd', 'time', 'timeEnd', 'count', 'assert', 'profile', 'profileEnd', 'table'];
            methods.forEach(function(method) {
                console[method] = noop;
            });
            
            var originalEval = window.eval;
            window.eval = function(code) {
                if (code.includes('view-source') || code.includes('outerHTML') || code.includes('document.documentElement')) {
                    alert('🚫 هذا الأمر غير مسموح');
                    return null;
                }
                return originalEval(code);
            };
            
            var lastUrl = window.location.href;
            setInterval(function() {
                if (window.location.href !== lastUrl) {
                    if (window.location.href.includes('view-source')) {
                        window.location.href = window.location.href.replace('view-source:', '');
                        alert('🚫 عرض المصدر غير مسموح');
                    }
                    lastUrl = window.location.href;
                }
            }, 500);
        })();
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0B4F8C, #1E81CE);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            direction: rtl;
        }
        .loader {
            text-align: center;
            color: #fff;
        }
        .loader .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #FFD60A;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            font-family: 'Lalezar', cursive;
        }
        .loader p {
            opacity: 0.8;
            font-size: 0.9rem;
        }
        .loader .version {
            margin-top: 12px;
            font-size: 0.7rem;
            opacity: 0.5;
        }
        .loader .progress-bar {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            margin: 16px auto 0;
            overflow: hidden;
        }
        .loader .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: #FFD60A;
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        #mainApp {
            width: 100%;
            min-height: 100vh;
            display: none;
        }
        #mainApp iframe {
            width: 100%;
            min-height: 100vh;
            border: none;
            display: block;
        }
        .no-select {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
    </style>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Lalezar&display=swap" rel="stylesheet">
</head>
<body>
    <div class="loader no-select" id="loaderScreen">
        <div class="spinner"></div>
        <h1>🧪 يلا كيمياء</h1>
        <p>جاري تحميل المنصة...</p>
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>
        <div class="version">v3.0</div>
    </div>
    
    <div id="mainApp">
        <iframe id="appFrame" src="app.html" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        (function() {
            if (window.top !== window.self) {
                window.top.location = window.self.location;
            }
            
            window.addEventListener('beforeunload', function(e) {
                e.preventDefault();
                e.returnValue = '';
            });
        })();
        
        var progress = 0;
        var progressFill = document.getElementById('progressFill');
        var interval = setInterval(function() {
            progress += Math.random() * 10;
            if (progress > 90) {
                clearInterval(interval);
                progress = 90;
            }
            progressFill.style.width = progress + '%';
        }, 200);
        
        document.getElementById('appFrame').addEventListener('load', function() {
            clearInterval(interval);
            progressFill.style.width = '100%';
            setTimeout(function() {
                document.getElementById('loaderScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
            }, 500);
        });
        
        setTimeout(function() {
            var frame = document.getElementById('appFrame');
            var loader = document.getElementById('loaderScreen');
            if (!frame.contentDocument || !frame.contentDocument.body) {
                loader.innerHTML = `
                    <div style="font-size:3rem;margin-bottom:12px;">⚠️</div>
                    <h1 style="font-family:'Lalezar',cursive;">حدث خطأ</h1>
                    <p>لم نتمكن من تحميل المنصة</p>
                    <button onclick="location.reload()" style="margin-top:16px;padding:8px 24px;border-radius:50px;border:none;background:#FFD60A;color:#081B2C;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;">🔄 إعادة المحاولة</button>
                `;
            }
        }, 15000);
    </script>
</body>
</html>
