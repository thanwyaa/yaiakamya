<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0B4F8C">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="يلا كيمياء">
    
    <link rel="icon" href="https://res.cloudinary.com/dbahe7lxz/image/upload/v1785593692/idraaak/ogvolfsxxnvk24gho8eb.jpg">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dbahe7lxz/image/upload/v1785593692/idraaak/ogvolfsxxnvk24gho8eb.jpg">
    <link rel="icon" sizes="192x192" href="https://res.cloudinary.com/dbahe7lxz/image/upload/v1785593692/idraaak/ogvolfsxxnvk24gho8eb.jpg">
    <link rel="icon" sizes="512x512" href="https://res.cloudinary.com/dbahe7lxz/image/upload/v1785593692/idraaak/ogvolfsxxnvk24gho8eb.jpg">
    <link rel="manifest" href="manifest.json">
    
    <title>يلا كيمياء</title>
    
    <script>
        if (window.location.href.includes('view-source')) {
            window.location.href = window.location.href.replace('view-source:', '');
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.key === 'u') || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i'))) {
                e.preventDefault();
                alert('🚫 غير مسموح');
                return false;
            }
        });
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            alert('🚫 النقر الأيمن غير مسموح');
            return false;
        });
        console.log = console.warn = console.error = function() {};
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0B4F8C, #1E81CE);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            direction: rtl;
        }
        .loader {
            text-align: center;
            color: #fff;
            animation: fadeInUp 0.8s ease;
        }
        .loader .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: block;
            border: 4px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 40px rgba(255,214,10,0.2);
            animation: pulseLogo 2s ease-in-out infinite;
            object-fit: cover;
        }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(255,214,10,0.2); }
            50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(255,214,10,0.4); }
        }
        .loader h1 {
            font-size: 2.5rem;
            margin-bottom: 4px;
            font-family: 'Lalezar', cursive;
            color: #FFD60A;
            text-shadow: 0 0 30px rgba(255,214,10,0.3);
        }
        .loader .subtitle {
            font-size: 1.3rem;
            opacity: 0.9;
            margin-bottom: 4px;
            font-weight: 600;
            color: #fff;
        }
        .loader .welcome {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 16px;
            color: rgba(255,255,255,0.9);
        }
        .loader .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #FFD60A;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader .progress-bar {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            margin: 12px auto 0;
            overflow: hidden;
        }
        .loader .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: #FFD60A;
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .loader .version {
            margin-top: 12px;
            font-size: 0.7rem;
            opacity: 0.4;
        }
        #mainApp {
            width: 100%;
            min-height: 100vh;
            display: none;
        }
        #mainApp iframe {
            width: 100%;
            min-height: 100vh;
            border: none;
            display: block;
        }
        .no-select {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Lalezar&display=swap" rel="stylesheet">
</head>
<body>
    <div class="loader no-select" id="loaderScreen">
        <img src="https://res.cloudinary.com/dbahe7lxz/image/upload/v1785593692/idraaak/ogvolfsxxnvk24gho8eb.jpg" alt="يلا كيمياء" class="logo">
        <h1>🧪 يلا كيمياء</h1>
        <div class="subtitle">👋 أهلاً بك يا صديقي</div>
        <div class="welcome">⏳ استني ثواني.. بنحضرلك المنصة</div>
        <div class="spinner"></div>
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>
        <div class="version">v3.0</div>
    </div>
    
    <div id="mainApp">
        <iframe id="appFrame" src="app.html" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        (function() {
            if (window.top !== window.self) {
                window.top.location = window.self.location;
            }
            window.addEventListener('beforeunload', function(e) {
                e.preventDefault();
                e.returnValue = '';
            });
        })();
        
        var progress = 0;
        var progressFill = document.getElementById('progressFill');
        var interval = setInterval(function() {
            progress += Math.random() * 10;
            if (progress > 90) {
                clearInterval(interval);
                progress = 90;
            }
            progressFill.style.width = progress + '%';
        }, 200);
        
        document.getElementById('appFrame').addEventListener('load', function() {
            clearInterval(interval);
            progressFill.style.width = '100%';
            setTimeout(function() {
                document.getElementById('loaderScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
            }, 500);
        });
        
        setTimeout(function() {
            var frame = document.getElementById('appFrame');
            var loader = document.getElementById('loaderScreen');
            if (!frame.contentDocument || !frame.contentDocument.body) {
                loader.innerHTML = `
                    <div style="font-size:3rem;margin-bottom:12px;">⚠️</div>
                    <h1 style="font-family:'Lalezar',cursive;color:#FFD60A;font-size:2rem;">حدث خطأ</h1>
                    <p style="color:#fff;font-size:1.1rem;">لم نتمكن من تحميل المنصة</p>
                    <button onclick="location.reload()" style="margin-top:16px;padding:10px 32px;border-radius:50px;border:none;background:#FFD60A;color:#081B2C;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;font-size:1rem;">🔄 إعادة المحاولة</button>
                `;
            }
        }, 15000);
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(function(registration) {
                        console.log('Service Worker registered:', registration);
                    })
                    .catch(function(error) {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
