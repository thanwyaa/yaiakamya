    <style>
        /* ====== كل الـ CSS ====== */
        :root {
            --bg: #EAF6FF;
            --card: #FFFFFF;
            --text: #081B2C;
            --text2: #0B4F8C;
            --border: #DCEFFF;
            --primary: #0B4F8C;
            --primary2: #1E81CE;
            --accent: #4CC9F0;
            --gold: #FFD60A;
            --gold-dark: #D4A800;
            --success: #22C55E;
            --danger: #EF4444;
            --warning: #FFA726;
            --shadow: 0 4px 12px rgba(11, 79, 140, 0.10);
            --radius: 16px;
            --radius-lg: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #F8FAFC;
            --text2: #38BDF8;
            --border: #334155;
            --primary: #38BDF8;
            --primary2: #0EA5E9;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ====== الحماية ====== */
        .no-copy {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* ====== زر التثبيت ====== */
        .install-app-btn {
            display: none !important;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 50px;
            background: linear-gradient(135deg, #FFD60A, #F59E0B);
            color: #081B2C !important;
            font-weight: 700;
            border: 2px solid #fff;
            cursor: pointer;
            font-size: clamp(0.6rem, 1vw, 0.85rem);
            font-family: 'Cairo', sans-serif;
            box-shadow: 0 4px 16px rgba(255, 214, 10, 0.4);
            transition: all 0.3s ease;
            animation: pulse-install 1.5s infinite;
        }
        .install-app-btn.visible { display: flex !important; }
        .install-app-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 24px rgba(255, 214, 10, 0.6);
        }
        .install-app-btn i { font-size: clamp(0.7rem, 1vw, 1.1rem); }
        .install-app-btn.installed {
            background: linear-gradient(135deg, #22C55E, #16A34A) !important;
            color: #fff !important;
            animation: none !important;
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.4) !important;
        }

        @keyframes pulse-install {
            0%, 100% { box-shadow: 0 4px 16px rgba(255, 214, 10, 0.4); }
            50% { box-shadow: 0 4px 28px rgba(255, 214, 10, 0.7); transform: scale(1.02); }
        }

        /* ====== باقي الـ CSS ====== */
        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(11, 79, 140, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: var(--transition);
            padding: 6px 0;
        }
        [data-theme="dark"] .navbar {
            background: rgba(15, 23, 42, 0.9);
            border-bottom-color: rgba(255, 255, 255, 0.05);
        }
        .navbar.scrolled { box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08); }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            flex-shrink: 0;
        }
        .nav-logo img {
            width: clamp(24px, 3vw, 40px);
            height: clamp(24px, 3vw, 40px);
            object-fit: contain;
        }
        .nav-logo span {
            font-family: 'Lalezar', cursive;
            font-size: clamp(0.75rem, 1.2vw, 1.2rem);
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 3px;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a, .nav-links button {
            padding: clamp(2px, 0.5vw, 6px) clamp(6px, 1vw, 14px);
            border-radius: 50px;
            font-weight: 600;
            font-size: clamp(0.55rem, 0.7vw, 0.8rem);
            transition: var(--transition);
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text2);
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
        }
        .nav-links a:hover, .nav-links button:hover {
            background: var(--border);
            color: var(--primary);
            transform: translateY(-1px);
        }
        .nav-links .btn-primary-nav {
            background: var(--primary);
            color: #fff !important;
            padding: clamp(2px, 0.5vw, 6px) clamp(10px, 1.5vw, 18px);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: clamp(6px, 1vw, 12px) clamp(14px, 2.5vw, 32px);
            border-radius: 50px;
            font-weight: 700;
            font-size: clamp(0.7rem, 0.8vw, 0.95rem);
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(11, 79, 140, 0.25);
            font-family: 'Cairo', sans-serif;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(11, 79, 140, 0.35);
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: clamp(6px, 1vw, 12px) clamp(14px, 2.5vw, 32px);
            border-radius: 50px;
            font-weight: 700;
            font-size: clamp(0.7rem, 0.8vw, 0.95rem);
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
        }
        .btn-outline:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-sm { padding: clamp(4px, 0.5vw, 8px) clamp(10px, 1.5vw, 20px); font-size: clamp(0.6rem, 0.7vw, 0.8rem); }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            height: 100%;
            position: relative;
        }
        .card:hover { 
            box-shadow: var(--shadow); 
            transform: translateY(-5px);
            border-color: var(--primary);
        }
        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.5s;
            aspect-ratio: 16/9;
            background: var(--bg);
        }
        @media (max-width: 768px) { .card-img { height: 170px; } }
        @media (max-width: 480px) { .card-img { height: 150px; } }
        .card-body { padding: 16px 18px; }

        .card-completed {
            border: 3px solid var(--success) !important;
            background: rgba(34, 197, 94, 0.08) !important;
        }
        .completed-overlay {
            display: none;
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            bottom: 0;
            background: rgba(34, 197, 94, 0.12);
            backdrop-filter: blur(2px);
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            z-index: 10;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
        }
        .card-completed .completed-overlay { display: flex !important; }
        .completed-overlay .check { font-size: 3rem; color: var(--success); }
        .completed-overlay .label {
            font-weight: 700;
            color: var(--success);
            font-size: 1.1rem;
            background: var(--card);
            padding: 4px 20px;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(34, 197, 94, 0.2);
        }

        .lock-overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 27, 44, 0.6);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            font-size: 2.5rem;
            color: #fff;
            pointer-events: none;
        }
        .lock-overlay .lock-text {
            font-size: 0.9rem;
            font-weight: 700;
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 14px 32px;
            border-radius: var(--radius);
            font-weight: 600;
            animation: slideUp 0.4s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            font-size: 0.95rem;
            font-family: 'Cairo', sans-serif;
        }
        .toast-success { background: var(--success); color: #fff; }
        .toast-error { background: var(--danger); color: #fff; }
        .toast-info { background: var(--primary); color: #fff; }
        .toast-warning { background: var(--warning); color: #fff; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            z-index: 9995;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .login-overlay.open { display: flex; }
        .login-box {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            max-width: 400px;
            width: 92%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
        }

        .grid-courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        @media (max-width: 768px) {
            .grid-courses { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        }
        @media (max-width: 480px) {
            .grid-courses { grid-template-columns: 1fr; gap: 12px; }
        }

        .video-wrapper {
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            margin-bottom: 24px;
            background: #000;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            background: var(--bg);
            border-radius: var(--radius-lg);
            border: 2px dashed var(--border);
        }
        .empty-state .icon { font-size: 4rem; margin-bottom: 12px; }
        .empty-state h3 { font-size: 1.3rem; font-weight: 700; color: var(--text); }
        .empty-state p { color: var(--text2); margin-top: 4px; }

        .skeleton {
            background: linear-gradient(90deg, var(--border) 25%, var(--bg) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius);
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (max-width: 768px) {
            .nav-container { padding: 0 8px; gap: 4px; }
            .nav-links { gap: 2px; }
            .nav-links a, .nav-links button { font-size: 0.6rem; padding: 3px 8px; }
            .nav-logo span { font-size: 0.85rem; }
            .nav-logo img { width: 28px; height: 28px; }
            .btn-primary, .btn-outline { padding: 8px 18px; font-size: 0.8rem; }
            .grid-courses { grid-template-columns: 1fr 1fr; gap: 10px; }
        }
        @media (max-width: 480px) {
            .nav-container { padding: 0 4px; gap: 2px; }
            .nav-links a, .nav-links button { font-size: 0.55rem; padding: 2px 6px; }
            .nav-logo span { font-size: 0.75rem; }
            .nav-logo img { width: 24px; height: 24px; }
            .btn-primary, .btn-outline { padding: 6px 14px; font-size: 0.7rem; }
            .grid-courses { grid-template-columns: 1fr; gap: 12px; }
            .card-img { height: 150px; }
        }
    </style>
</head>
<body>

    <script>
    // ============================================================
    // 🔒 SYSTEM PROTECTION - الحماية الشاملة
    // ============================================================
    (function() {
        'use strict';
        
        // منع view-source
        if (window.location.href.includes('view-source')) {
            window.location.href = window.location.href.replace('view-source:', '');
        }
        
        // منع اختصارات الكيبورد
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12') {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            // Ctrl+U (view source)
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            // Ctrl+Shift+I (dev tools)
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            // Ctrl+Shift+J (console)
            if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            // Ctrl+Shift+C (inspect)
            if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            // Ctrl+N (new window)
            if (e.ctrlKey && (e.key === 'n' || e.key === 'N')) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            // Ctrl+T (new tab)
            if (e.ctrlKey && (e.key === 't' || e.key === 'T')) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });
        
        // منع النقر الأيمن
        document.addEventListener('contextmenu', function(e) {
            const allowed = e.target.closest('input, textarea, select, button, a');
            if (!allowed) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });
        
        // تعطيل Console
        const noop = () => {};
        const consoleMethods = ['log', 'info', 'warn', 'error', 'debug', 'trace', 'dir', 'dirxml', 'group', 'groupEnd', 'time', 'timeEnd', 'count', 'assert', 'profile', 'profileEnd', 'table'];
        consoleMethods.forEach(method => {
            console[method] = noop;
        });
        
        // تعطيل eval
        const originalEval = window.eval;
        window.eval = function(code) {
            if (code.includes('view-source') || code.includes('outerHTML') || code.includes('document.documentElement')) {
                return null;
            }
            return originalEval(code);
        };
        
        // مراقبة تغيير URL
        let lastUrl = window.location.href;
        setInterval(() => {
            if (window.location.href !== lastUrl) {
                if (window.location.href.includes('view-source')) {
                    window.location.href = window.location.href.replace('view-source:', '');
                }
                lastUrl = window.location.href;
            }
        }, 500);
    })();

    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {

    async function completeLessonWatch(lessonId) {
        try {
            if (userCourseProgress[lessonId]?.watched) return;
            const lesson = allLessons.find(l => l.id === lessonId);
            if (!lesson) return;
            
            const atomsReward = lesson.atomsReward || 5;
            const userRef = database.ref('users/' + currentUser.uid);
            const userSnap = await userRef.once('value');
            
            if (userSnap.exists()) {
                const currentAtoms = userSnap.val().atoms || 0;
                await database.ref('users/' + currentUser.uid + '/progress/' + lessonId).set({
                    watched: true,
                    completedAt: new Date().toISOString()
                });
                await userRef.update({
                    atoms: currentAtoms + atomsReward,
                    videosWatched: (userSnap.val().videosWatched || 0) + 1,
                    lessonsCompleted: (userSnap.val().lessonsCompleted || 0) + 1
                });
                if (userData) {
                    userData.atoms = currentAtoms + atomsReward;
                    userData.videosWatched = (userData.videosWatched || 0) + 1;
                    userData.lessonsCompleted = (userData.lessonsCompleted || 0) + 1;
                }
                userCourseProgress[lessonId] = { watched: true, completedAt: new Date().toISOString() };
                showToast(`🎉 +${atomsReward} ذرة!`, 'success');
            }
        } catch (err) {
            console.error('Error completing lesson watch:', err);
        }
    }

    function extractYouTubeId(url) {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    // ============================================================

        });
    }
