    <style>
        /* ============================================================
           كل الـ CSS
           ============================================================ */
        :root {
            --bg: #EAF6FF;
            --card: #FFFFFF;
            --text: #081B2C;
            --text2: #0B4F8C;
            --border: #DCEFFF;
            --primary: #0B4F8C;
            --primary2: #1E81CE;
            --accent: #4CC9F0;
            --gold: #FFD60A;
            --gold-dark: #D4A800;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
            --success: #22C55E;
            --danger: #EF4444;
            --warning: #FFA726;
            --shadow: 0 4px 12px rgba(11, 79, 140, 0.10);
            --radius: 16px;
            --radius-lg: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #F8FAFC;
            --text2: #38BDF8;
            --border: #334155;
            --primary: #38BDF8;
            --primary2: #0EA5E9;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .font-lalezar { font-family: 'Lalezar', cursive; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* ====== NAVBAR ====== */
        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(11, 79, 140, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: var(--transition);
            padding: 6px 0;
        }
        [data-theme="dark"] .navbar {
            background: rgba(15, 23, 42, 0.9);
            border-bottom-color: rgba(255, 255, 255, 0.05);
        }
        .navbar.scrolled { box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08); }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            flex-shrink: 0;
        }
        .nav-logo img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border: none !important;
            border-radius: 0 !important;
            background: transparent !important;
        }
        .nav-logo span {
            font-family: 'Lalezar', cursive;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 3px;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a, .nav-links button {
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text2);
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            position: relative;
        }
        .nav-links a:hover, .nav-links button:hover {
            background: var(--border);
            color: var(--primary);
            transform: translateY(-1px);
        }
        .nav-links .btn-primary-nav {
            background: var(--primary);
            color: #fff !important;
            padding: 6px 18px;
        }
        .nav-links .btn-primary-nav:hover {
            background: var(--primary2);
            transform: translateY(-1px);
        }

        /* ====== زر التثبيت ====== */
        .install-app-btn {
            display: flex !important;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 50px;
            background: linear-gradient(135deg, #FFD60A, #F59E0B);
            color: #081B2C !important;
            font-weight: 700;
            border: 2px solid #fff;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Cairo', sans-serif;
            box-shadow: 0 4px 16px rgba(255, 214, 10, 0.4);
            transition: all 0.3s ease;
            animation: pulse-install 1.5s infinite;
        }
        .install-app-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 24px rgba(255, 214, 10, 0.6);
        }
        .install-app-btn i { font-size: 1.1rem; }
        .install-app-btn.installed {
            background: var(--success);
            color: #fff !important;
            animation: none;
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.4);
        }

        @keyframes pulse-install {
            0%, 100% { box-shadow: 0 4px 16px rgba(255, 214, 10, 0.4); }
            50% { box-shadow: 0 4px 28px rgba(255, 214, 10, 0.7); transform: scale(1.02); }
        }

        .theme-toggle {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 50px;
            padding: 6px 12px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text);
            min-width: 60px;
            justify-content: center;
        }
        .theme-toggle:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .atoms-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            background: var(--gold);
            color: #081B2C;
        }

        .user-menu-wrapper { position: relative; display: flex; align-items: center; gap: 4px; }
        .user-menu-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px 4px 6px;
            border-radius: 50px;
            border: 2px solid var(--primary);
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
        }
        .user-menu-btn:hover { background: var(--primary2); border-color: var(--primary2); }
        .user-menu-btn .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.7rem;
            overflow: hidden;
            background: rgba(255,255,255,0.2);
        }
        .user-menu-btn .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-menu-btn .arrow { font-size: 0.6rem; transition: var(--transition); }
        .user-menu-btn .arrow.open { transform: rotate(180deg); }
        .user-menu-btn .label { display: inline-block; color: #fff; font-size: 0.8rem; }

        .user-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 210px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            z-index: 200;
            padding: 4px 0;
        }
        .user-dropdown.open { display: block; }
        .user-dropdown .dropdown-header { padding: 10px 14px; border-bottom: 1px solid var(--border); }
        .user-dropdown .dropdown-header .name { font-weight: 700; font-size: 0.9rem; color: var(--text); }
        .user-dropdown .dropdown-header .sub { font-size: 0.7rem; color: var(--text2); }
        .user-dropdown .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            width: 100%;
            border: none;
            background: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Cairo', sans-serif;
            font-size: 0.8rem;
            color: var(--text);
            text-align: right;
        }
        .user-dropdown .menu-item:hover { background: var(--bg); }
        .user-dropdown .menu-item i { width: 18px; text-align: center; font-size: 0.85rem; color: var(--text2); }
        .user-dropdown .menu-item.danger { color: var(--danger); }
        .user-dropdown .menu-item.danger:hover { background: rgba(239,68,68,0.08); }
        .user-dropdown .menu-divider { height: 1px; background: var(--border); margin: 4px 12px; }

        /* ====== BUTTONS ====== */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(11, 79, 140, 0.25);
            font-family: 'Cairo', sans-serif;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(11, 79, 140, 0.35);
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
        }
        .btn-outline:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-sm { padding: 8px 20px; font-size: 0.8rem; }

        /* ====== TOAST ====== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 14px 32px;
            border-radius: var(--radius);
            font-weight: 600;
            animation: slideUp 0.4s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            font-size: 0.95rem;
            font-family: 'Cairo', sans-serif;
        }
        .toast-success { background: var(--success); color: #fff; }
        .toast-error { background: var(--danger); color: #fff; }
        .toast-info { background: var(--primary); color: #fff; }
        .toast-warning { background: var(--warning); color: #fff; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 500px; pointer-events: none; }
        .toast { pointer-events: auto; }

        /* ====== LOGIN OVERLAY ====== */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            z-index: 9995;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .login-overlay.open { display: flex; }
        .login-box {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            max-width: 400px;
            width: 92%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
        }

        /* ====== CARDS ====== */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            height: 100%;
            position: relative;
        }
        .card:hover { 
            box-shadow: var(--shadow); 
            transform: translateY(-5px);
            border-color: var(--primary);
        }
        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.5s;
            aspect-ratio: 16/9;
            background: var(--bg);
        }
        @media (max-width: 768px) { .card-img { height: 170px; } }
        @media (max-width: 480px) { .card-img { height: 150px; } }
        .card:hover .card-img { transform: scale(1.03); }
        .card-body { padding: 16px 18px; }

        .grid-courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        @media (max-width: 768px) {
            .grid-courses { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        }
        @media (max-width: 480px) {
            .grid-courses { grid-template-columns: 1fr; gap: 12px; }
        }

        /* ====== LESSONS ====== */
        .lesson-container {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 12px;
            overflow: hidden;
            background: var(--card);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lesson-container:hover { border-color: var(--primary); }
        .lesson-header {
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 700;
            color: var(--text);
            font-size: 1rem;
            user-select: none;
        }
        .lesson-header:hover { background: var(--border); }
        .lesson-header .lesson-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            font-size: 0.8rem;
            margin-left: 12px;
            flex-shrink: 0;
        }
        .lesson-header .toggle-icon { transition: var(--transition); font-size: 0.9rem; }
        .lesson-container.open .toggle-icon { transform: rotate(180deg); }
        .lesson-container.open .lesson-header { background: var(--primary); color: #fff; }
        .lesson-container.open .lesson-header .lesson-num { background: #fff; color: var(--primary); }

        .lesson-body { padding: 0 16px 16px; display: none; }
        .lesson-container.open .lesson-body { display: block; }

        .lesson-content-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: var(--radius);
            margin-top: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
            cursor: pointer;
            background: var(--card);
            min-height: 56px;
            position: relative;
        }
        .lesson-content-item:hover { border-color: var(--primary); background: var(--bg); transform: translateX(-4px); }
        .lesson-content-item .item-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #fff;
            font-size: 1.1rem;
        }
        .lesson-content-item .item-icon.video { background: #EF4444; }
        .lesson-content-item .item-icon.exam { background: #F59E0B; }
        .lesson-content-item .item-icon.pdf { background: #DC2626; }
        .lesson-content-item .item-text { flex: 1; }
        .lesson-content-item .item-text .title { font-weight: 600; color: var(--text); font-size: 0.95rem; }
        .completed-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--success);
            color: #fff;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 10px; overflow: hidden; }
        .progress-bar .fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--primary), var(--primary2));
            transition: width 0.6s ease;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            background: var(--bg);
            border-radius: var(--radius-lg);
            border: 2px dashed var(--border);
        }
        .empty-state .icon { font-size: 4rem; margin-bottom: 12px; }
        .empty-state h3 { font-size: 1.3rem; font-weight: 700; color: var(--text); }
        .empty-state p { color: var(--text2); margin-top: 4px; }

        /* ====== VIDEO ====== */
        .video-protected {
            position: relative;
            width: 100%;
            max-width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            overflow: hidden;
            border-radius: var(--radius-lg);
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .video-protected iframe, .video-protected video {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: none;
        }

        .video-watermark {
            position: absolute;
            bottom: 15px;
            right: 15px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
            z-index: 15;
            pointer-events: none;
            font-weight: bold;
            font-family: 'Cairo', Arial, sans-serif;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .video-watermark .gold-text { color: var(--gold); }

        .dynamic-watermark {
            position: absolute;
            color: rgba(255, 255, 255, 0.15);
            font-size: 2.2rem;
            z-index: 15;
            pointer-events: none;
            transition: all 3s ease-in-out;
            font-family: 'Lalezar', cursive;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            font-weight: 900;
            letter-spacing: 4px;
            opacity: 0.6;
            top: 10px;
            left: 10px;
            white-space: nowrap;
        }
        .dynamic-watermark .gold-text { color: var(--gold); opacity: 0.8; }

        /* ====== VIDEO CONTROLS ====== */
        .video-controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 16px;
            border-radius: 50px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto !important;
        }

        .video-controls-overlay button {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 40px;
            justify-content: center;
            pointer-events: auto !important;
        }

        .video-controls-overlay button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .video-controls-overlay button.active {
            background: var(--primary);
            border-color: var(--primary);

    function installApp() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    showToast('✅ تم تثبيت التطبيق بنجاح!', 'success');
                    markAppInstalled();
                }
                deferredPrompt = null;
            });
            return;
        }
        showToast('📱 التثبيت غير متاح على هذا المتصفح', 'info');
    }

    function markAppInstalled() {
        const installBtn = document.getElementById('installAppBtn');
        if (installBtn) {
            installBtn.classList.add('installed');
            installBtn.innerHTML = '✅ تم تثبيت التطبيق';
            installBtn.onclick = () => {
                showToast('✅ التطبيق مثبت بالفعل', 'info');
            };
        }
        localStorage.setItem('appInstalled', 'true');
    }

    function updateInstallButtonVisibility() {
        const installBtn = document.getElementById('installAppBtn');
        if (!installBtn) return;
        
        if (window.matchMedia('(display-mode: standalone)').matches || localStorage.getItem('appInstalled') === 'true') {
            markAppInstalled();
            return;
        }
        
        if (deferredPrompt) {
            installBtn.style.display = 'flex';
            installBtn.classList.remove('installed');
            installBtn.innerHTML = '<i class="fas fa-download"></i> 📲 حمل التطبيق';
            installBtn.onclick = installApp;
        }
    }

    window.addEventListener('DOMContentLoaded', function() {
        updateInstallButtonVisibility();
        window.matchMedia('(display-mode: standalone)').addEventListener('change', function(e) {
            if (e.matches) {
                markAppInstalled();
            }
        });
    });

    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const newTheme = !isDark;
        document.documentElement.setAttribute('data-theme', newTheme ? 'dark' : 'light');
        localStorage.setItem('theme', newTheme ? 'dark' : 'light');
        const btn = document.querySelector('.theme-toggle');
        if (btn) btn.innerHTML = `<span class="slider">${newTheme ? '🌙' : '☀️'}</span>`;
        showToast(newTheme ? '🌙 الوضع الليلي' : '☀️ الوضع النهاري', 'info');
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = savedTheme ? savedTheme === 'dark' : prefersDark;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        const btn = document.querySelector('.theme-toggle');
        if (btn) btn.innerHTML = `<span class="slider">${isDark ? '🌙' : '☀️'}</span>`;

    let currentSpeed = 1;

    let isMuted = false;

    function togglePlay() {
        const iframe = document.getElementById('videoFrame');
        if (iframe) {
            // إرسال أمر تشغيل/إيقاف لليوتيوب
            iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
            setTimeout(() => {
                iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
            }, 100);
        }
        showToast('▶️ تم تغيير حالة التشغيل', 'info');
    }

    function changeSpeed() {
        const speeds = [0.5, 0.75, 1, 1.25, 1.5, 2];
        const currentIndex = speeds.indexOf(currentSpeed);
        const nextIndex = (currentIndex + 1) % speeds.length;
        currentSpeed = speeds[nextIndex];
        
        const iframe = document.getElementById('videoFrame');
        if (iframe) {
            iframe.contentWindow.postMessage(`{"event":"command","func":"setPlaybackRate","args":["${currentSpeed}"]}`, '*');
        }
        
        const speedBtn = document.getElementById('speedBtn');
        if (speedBtn) speedBtn.textContent = `⏩ ${currentSpeed}x`;
        
        showToast(`⏩ السرعة: ${currentSpeed}x`, 'info');
    }

    function changeQuality() {
        const qualities = ['auto', '1080p', '720p', '480p', '360p'];
        const currentIndex = qualities.indexOf(currentQuality);
        const nextIndex = (currentIndex + 1) % qualities.length;
        currentQuality = qualities[nextIndex];
        
        const qualityBtn = document.getElementById('qualityBtn');
        if (qualityBtn) qualityBtn.textContent = `🎬 ${currentQuality}`;
        
        showToast(`🎬 الجودة: ${currentQuality}`, 'info');
    }

    function toggleMute() {
        isMuted = !isMuted;
        const iframe = document.getElementById('videoFrame');
        if (iframe) {
            if (isMuted) {
                iframe.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
            } else {
                iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
            }
        }
        
        const volumeBtn = document.getElementById('volumeBtn');
        if (volumeBtn) {
            volumeBtn.textContent = isMuted ? '🔇 كتم' : `🔊 ${currentVolume}%`;
        }
        
        showToast(isMuted ? '🔇 تم الكتم' : '🔊 تم إلغاء الكتم', 'info');
    }

    function changeVolume() {
        const volumes = [0, 25, 50, 75, 100];
        const currentIndex = volumes.indexOf(currentVolume);
        const nextIndex = (currentIndex + 1) % volumes.length;
        currentVolume = volumes[nextIndex];
        
        const iframe = document.getElementById('videoFrame');
        if (iframe) {
            iframe.contentWindow.postMessage(`{"event":"command","func":"setVolume","args":["${currentVolume}"]}`, '*');
        }
        
        const volumeBtn = document.getElementById('volumeBtn');
        if (volumeBtn) {
            if (currentVolume === 0) {
                volumeBtn.textContent = '🔇 كتم';

                volumeBtn.textContent = `🔊 ${currentVolume}%`;

    function toggleFullscreenVideo() {
        const container = document.getElementById('videoContainer');
        if (!container) return;
        
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
                const iframe = document.getElementById('videoFrame');
                if (iframe) {

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function extractYouTubeId(url) {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function updateUIForAuth(user) {
        const guestElements = document.querySelectorAll('.guest-only');
        const userElements = document.querySelectorAll('.user-only');

        if (user) {
            guestElements.forEach(el => { el.style.display = 'none'; });
            userElements.forEach(el => { el.style.display = 'block'; });
            if (userData) updateUserUI(userData);
        } else {
            guestElements.forEach(el => { el.style.display = 'block'; });
            userElements.forEach(el => { el.style.display = 'none'; });
            userData = null;

                allCourses.push({ id: child.key, ...data });

            allCourses.sort((a, b) => (a.order || 0) - (b.order || 0));
            renderCourses(allCourses);
        });

        database.ref('lessons').once('value', (snapshot) => {

            });
        });

    function isPremiumCourse(courseId) {
        if (!currentUser || !userData) return false;
        return userData.premiumCourses && userData.premiumCourses[courseId] === true;
    }

    function isUserSubscribed(courseId) {
        if (isPremiumCourse(courseId)) return true;
        return userSubscriptions.some(sub => sub.courseId === courseId && sub.status === 'active');
    }

        if (!currentUser) { showLoginOverlay(); return; }
        const course = allCourses.find(c => c.id === courseId);

        if (course.isFree !== false) {
            if (isPremiumCourse(courseId)) { showToast('✅ أنت مشترك بالفعل', 'info'); return; }
            try {
                await database.ref('users/' + currentUser.uid + '/premiumCourses/' + courseId).set(true);
                if (userData) {
                    if (!userData.premiumCourses) userData.premiumCourses = {};
                    userData.premiumCourses[courseId] = true;

                if (container && dynamicWM) {
                    if (dynamicWatermarkTimer) clearInterval(dynamicWatermarkTimer);
                    dynamicWatermarkTimer = setInterval(() => {
                        if (!container || !dynamicWM) return;
                        const maxWidth = container.clientWidth - 120;
                        const maxHeight = container.clientHeight - 60;
                        const randomX = Math.floor(Math.random() * Math.max(0, maxWidth));
                        const randomY = Math.floor(Math.random() * Math.max(0, maxHeight));
                        dynamicWM.style.left = randomX + 'px';
                        dynamicWM.style.top = randomY + 'px';
                    }, 4000);
                }
            }, 500);
            
            if (isCompleted) {
                if (videoProgressTimer) clearInterval(videoProgressTimer);
                return;
            }
            
            let watchSeconds = 0;
            const lessonDuration = parseInt(lessonData.duration) || 15;
            const totalSeconds = lessonDuration * 60;
            
            if (videoProgressTimer) clearInterval(videoProgressTimer);
            videoProgressTimer = setInterval(() => {
                watchSeconds++;
                const mins = Math.floor(watchSeconds / 60);
                const secs = watchSeconds % 60;
                const timerEl = document.getElementById('watchTimer');
                if (timerEl) {
                    timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                }
                const progress = Math.min((watchSeconds / totalSeconds) * 100, 100);
                const fillEl = document.getElementById('watchProgressFill');
                const percentLabel = document.getElementById('progressPercentLabel');
                if (fillEl) fillEl.style.width = `${progress}%`;
                if (percentLabel) percentLabel.textContent = `${Math.round(progress)}%`;
                
                if (progress >= 90 && !userCourseProgress[lessonId]?.watched) {
                    completeLessonWatch(lessonId);
                    if (videoProgressTimer) {
                        clearInterval(videoProgressTimer);
                        videoProgressTimer = null;
                    }
                    if (dynamicWatermarkTimer) {
                        clearInterval(dynamicWatermarkTimer);
                        dynamicWatermarkTimer = null;
                    }
                }
            }, 1000);

            console.error('openLessonVideo error:', error);
            showToast('حدث خطأ في تحميل الفيديو', 'error');
            showHome();

    function protectVideoPlayer() {
        const videoContainer = document.getElementById('videoContainer');
        if (!videoContainer) return;
        
        videoContainer.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            e.stopPropagation();
            showToast('🚫 النقر الأيمن على الفيديو غير مسموح', 'warning');
            return false;
        });
        
        videoContainer.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
        });
        
        videoContainer.addEventListener('copy', function(e) {
            e.preventDefault();
            e.stopPropagation();
            showToast('🚫 نسخ الفيديو غير مسموح', 'warning');
            return false;
        });
        
        videoContainer.style.userSelect = 'none';
        videoContainer.style.webkitUserSelect = 'none';
        videoContainer.style.mozUserSelect = 'none';
        videoContainer.style.msUserSelect = 'none';
        
        const iframe = document.getElementById('videoFrame');
        if (iframe) {
            iframe.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                e.stopPropagation();
                showToast('🚫 غير مسموح', 'warning');
                return false;
            });
            iframe.style.pointerEvents = 'none';
        }
    }

    async function completeLessonWatch(lessonId) {
        try {
            if (userCourseProgress[lessonId]?.watched) return;
            const lesson = allLessons.find(l => l.id === lessonId);
            if (!lesson) return;
            
            const atomsReward = lesson.atomsReward || 5;
            const userRef = database.ref('users/' + currentUser.uid);
            const userSnap = await userRef.once('value');
            
            if (userSnap.exists()) {
                const currentAtoms = userSnap.val().atoms || 0;
                await database.ref('users/' + currentUser.uid + '/progress/' + lessonId).set({
                    watched: true,
                    watchPercent: 100,
                    completedAt: new Date().toISOString(),
                    type: 'lesson'
                });
                
                await userRef.update({
                    atoms: currentAtoms + atomsReward,
                    videosWatched: (userSnap.val().videosWatched || 0) + 1,
                    lessonsCompleted: (userSnap.val().lessonsCompleted || 0) + 1
                });
                
                if (userData) {
                    userData.atoms = currentAtoms + atomsReward;
                    userData.videosWatched = (userData.videosWatched || 0) + 1;
                    userData.lessonsCompleted = (userData.lessonsCompleted || 0) + 1;
                }
                
                userCourseProgress[lessonId] = {
                    watched: true,
                    watchPercent: 100,
                    completedAt: new Date().toISOString()
                };
                
                document.getElementById('atomsCount').textContent = currentAtoms + atomsReward;
                document.getElementById('userAtomsCount').textContent = currentAtoms + atomsReward;
                showToast(`🎉 +${atomsReward} ذرة! (أكملت مشاهدة ${lesson.title})`, 'success');
                loadUserProgress(currentUser.uid);
            }
        } catch (err) {
            console.error('Error completing lesson watch:', err);
        }
    }

    function handleVideoExit(lessonId) {
        if (videoProgressTimer) {
            clearInterval(videoProgressTimer);
            videoProgressTimer = null;
        }
        if (dynamicWatermarkTimer) {
            clearInterval(dynamicWatermarkTimer);
            dynamicWatermarkTimer = null;
        }
        const lesson = allLessons.find(l => l.id === lessonId);
        if (lesson) {
            openCoursePage(lesson.courseId);
        } else {
            showHome();
        }
    }

    function filterCoursesByGrade(grade) {

        document.querySelectorAll('.btn-filter').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.grade === grade) { btn.classList.add('active'); }
        });
        filterCourses();

    function filterCourses() {
        const grid = document.getElementById('coursesGrid');
        if (!grid) return;
        const q = document.getElementById('courseSearch')?.value?.toLowerCase() || '';
        let filtered = allCourses.filter(c => {
            const matchesSearch = (c.title || '').toLowerCase().includes(q) || (c.description || '').toLowerCase().includes(q);
            let matchesGrade = true;
            if (currentGradeFilter !== 'all') { matchesGrade = (c.grade || '').includes(currentGradeFilter); }
            return matchesSearch && matchesGrade;
        });
        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
                <div class="icon">📚</div>
                <h3>لا توجد كورسات</h3>
                <p>${currentGradeFilter !== 'all' ? `(الصف: ${currentGradeFilter})` : ''}</p>
            </div>`;
        } else { renderCourses(filtered); }
    }

    async function loadLeaderboard() {
        const container = document.getElementById('leaderboardContainer');
        if (!container) return;
        try {
            const snapshot = await database.ref('users').orderByChild('atoms').limitToLast(10).once('value');
            let users = [];
            snapshot.forEach((child) => {
                const data = child.val();
                users.push({
                    id: child.key,
                    name: data.name || 'مستخدم',
                    atoms: data.atoms || 0,
                    photoURL: data.photoURL || '',
                    rank: data.rank || '--'
                });
            });
            users.sort((a, b) => b.atoms - a.atoms);
            if (users.length === 0) {
                container.innerHTML = `<div style="text-align:center;padding:40px;"><div style="font-size:3rem;">🏆</div><h3 style="margin-top:8px;">لا يوجد متصدرين</h3></div>`;
                return;
            }
            
            let html = `<div class="leaderboard-podium">`;
            const top3 = users.slice(0, 3);
            const podiumData = [
                { index: 1, user: top3[1], class: 'silver', rank: '🥈' },
                { index: 0, user: top3[0], class: 'gold', rank: '👑' },
                { index: 2, user: top3[2], class: 'bronze', rank: '🥉' }
            ];
            podiumData.forEach(p => {
                if (!p.user) return;
                const avatarHtml = p.user.photoURL ? `<img src="${p.user.photoURL}" style="width:100%;height:100%;object-fit:cover;">` : `<span style="font-size:1.5rem;">${(p.user.name || '👤')[0].toUpperCase()}</span>`;

                container.innerHTML += `
                    <div style="text-align:center;margin-top:16px;padding:12px;background:var(--card);border-radius:var(--radius);border:2px solid var(--gold);">
                        <span style="font-size:1.1rem;font-weight:700;color:var(--text);">
                            🏅 ترتيبك الحالي: 
                            <span style="color:var(--gold-dark);font-size:1.3rem;">#${userData.rank || '--'}</span>
                        </span>
                        <span style="margin-right:16px;font-size:0.9rem;color:var(--text2);">
                            ⚛️ ${userData.atoms || 0} ذرة
                        </span>
                    </div>
                `;
            }
        } catch (error) {
            console.error('Error loading leaderboard:', error);
            container.innerHTML = `<div style="text-align:center;padding:20px;color:var(--danger);">⚠️ حدث خطأ في تحميل المتصدرين</div>`;
        }
    }

    function showLeaderboard() {
        const main = document.getElementById('mainContent');
        if (!main) return;
        main.innerHTML = `
            <div style="max-width:1280px;margin:0 auto;padding:20px;">
                <button class="btn-outline btn-sm no-print" onclick="APP.showHome()"><i class="fas fa-arrow-right"></i> العودة</button>
                <h1 style="font-family:'Lalezar',cursive;font-size:clamp(1.5rem,2.5vw,2.5rem);color:var(--text);margin:12px 0 4px;">🏆 المتصدرين</h1>
                <p style="color:var(--text2);margin-bottom:16px;">أفضل 5 طلاب على المنصة</p>
                <div id="leaderboardContainer"></div>
            </div>
        `;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        loadLeaderboard();
    }

    // ============================================================
    // HOME PAGE
    // ============================================================
    function showHome() {
        const main = document.getElementById('mainContent');
        if (!main) return;
        const isUser = currentUser !== null;

        const installBtnHTML = `
            <div style="text-align:center;padding:10px 20px;margin:10px auto;max-width:600px;">
                <button onclick="installApp()" style="
                    background:linear-gradient(135deg,#FFD60A,#F59E0B);
                    color:#081B2C;
                    border:none;
                    padding:18px 50px;
                    border-radius:60px;
                    font-size:1.4rem;
                    font-weight:900;
                    font-family:'Cairo',sans-serif;
                    cursor:pointer;
                    box-shadow:0 8px 32px rgba(255,214,10,0.5);
                    transition:all 0.3s ease;
                    display:inline-flex;
                    align-items:center;
                    gap:14px;
                    animation:pulse-install 2s infinite;
                    border:3px solid rgba(255,255,255,0.3);
                    width:100%;
                    justify-content:center;
                    max-width:500px;
                "
                onmouseover="this.style.transform='scale(1.05)';this.style.boxShadow='0 12px 48px rgba(255,214,10,0.7)';"
                onmouseout="this.style.transform='scale(1)';this.style.boxShadow='0 8px 32px rgba(255,214,10,0.5)';">
                    <i class="fas fa-download" style="font-size:1.8rem;"></i>
                    📲 ثبّت التطبيق على جهازك الآن
                    <span style="background:#EF4444;color:#fff;padding:2px 14px;border-radius:20px;font-size:0.8rem;animation:blinkPulse 1.2s infinite;">جديد</span>
                </button>
                <p style="font-size:0.85rem;color:var(--text2);margin-top:8px;">
                    <i class="fas fa-check-circle" style="color:var(--success);"></i> 
                    متوافق مع Android • iPhone • كمبيوتر
                </p>
            </div>
        `;

        main.innerHTML = `
            <section style="padding:40px 20px 20px;max-width:1280px;margin:0 auto;">
                <div style="width:100%;border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.08);margin-bottom:24px;position:relative;background:var(--bg);">
                    <img src="${HERO_IMAGE}" alt="مستر زياد مبروك" loading="eager" fetchpriority="high" onerror="this.style.display='none'" style="width:100%;height:auto;max-height:450px;object-fit:cover;display:block;aspect-ratio:16/7;">
                </div>

                ${installBtnHTML}

                <div class="video-section-title">تفاصيل بداية المنهج وتفاصيل المنصة | خطة الكيمياء الكاملة لطلاب دفعة 2027 مع مستر زياد مبروك</div>
                
                <div class="video-wrapper">
                    <iframe src="${INTRO_VIDEO_URL}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
                </div>
                
                <div style="text-align:center;">
                    <h1 style="font-family:'Lalezar',cursive;font-size:clamp(2rem,5vw,3.5rem);color:var(--text);margin-bottom:12px;">ابدأ صح… وخلّي الكيمياء تبقى لعبتك 🔥</h1>
                    <p style="font-size:clamp(1rem,1.5vw,1.2rem);color:var(--text2);max-width:600px;margin:0 auto 20px;font-weight:600;">مهما كان مستواك، هنا هتبدأ من الأول خالص… وهتمشي خطوة خطوة لحد ما توصل للفهم الحقيقي 💪</p>
                    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                        ${isUser ? `
                            <button class="btn-primary" onclick="APP.scrollToCourses()">📚 كورساتي</button>
                            <button class="btn-primary" onclick="APP.showDashboard()" style="background:var(--gold);color:#081B2C;">👨‍🎓 لوحة الطالب</button>
                        ` : `
                            <a href="login.html" class="btn-primary">🚀 ابدأ التعلم الآن</a>
                            <a href="login.html" class="btn-outline">⚪ سجل دخول</a>
                        `}
                    </div>
                </div>
            </section>

            <section id="coursesSection" style="max-width:1280px;margin:0 auto;padding:0 20px 32px;">
                <h2 style="font-family:'Lalezar',cursive;font-size:clamp(1.5rem,2.5vw,2.5rem);text-align:center;color:var(--text);margin-bottom:4px;">📚 الكورسات المتاحة</h2>
                <p style="text-align:center;color:var(--text2);margin-bottom:12px;">اختر صفك الدراسي وابدأ التعلم</p>
                <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;">
                    <button class="btn-filter active" data-grade="all" onclick="APP.filterCoursesByGrade('all')">📚 جميع الصفوف</button>
                    <button class="btn-filter" data-grade="أولى ثانوي" onclick="APP.filterCoursesByGrade('أولى ثانوي')">📖 أولى ثانوي</button>
                    <button class="btn-filter" data-grade="تانية ثانوي" onclick="APP.filterCoursesByGrade('تانية ثانوي')">📖 تانية ثانوي</button>
                    <button class="btn-filter" data-grade="تالتة ثانوي" onclick="APP.filterCoursesByGrade('تالتة ثانوي')">📖 تالتة ثانوي</button>
                </div>
                <div style="max-width:400px;margin:0 auto 16px;position:relative;">
                    <input type="text" id="courseSearch" placeholder="🔍 ابحث عن كورس..." style="width:100%;padding:8px 16px;padding-right:40px;border-radius:50px;border:2px solid var(--border);background:var(--card);color:var(--text);font-family:'Cairo',sans-serif;font-size:0.9rem;outline:none;transition:var(--transition);" oninput="APP.filterCourses()">
                    <i class="fas fa-search" style="position:absolute;top:50%;right:14px;transform:translateY(-50%);color:var(--text2);"></i>
                </div>
                <div class="grid-courses" id="coursesGrid">
                    <div class="card skeleton" style="height:320px;"></div>
                    <div class="card skeleton" style="height:320px;"></div>
                    <div class="card skeleton" style="height:320px;"></div>
                </div>
            </section>

            <section id="leaderboardSection" style="max-width:1280px;margin:0 auto;padding:0 20px 32px;">
                <h2 style="font-family:'Lalezar',cursive;font-size:clamp(1.5rem,2.5vw,2.5rem);text-align:center;color:var(--text);margin-bottom:4px;">🏆 المتصدرين - أفضل 5 طلاب</h2>
                <p style="text-align:center;color:var(--text2);margin-bottom:12px;">أفضل الطلاب في منصة يلا كيمياء</p>
                <div id="leaderboardContainer"><div class="card skeleton" style="height:400px;"></div></div>
            </section>
        `;
        
        loadCourses();
        loadLeaderboard();
    }

    // ============================================================
    // INIT
    // ============================================================
    function setupScrollHandlers() {
        const backBtn = document.getElementById('backTop');
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            if (backBtn) backBtn.style.display = scrollY > 500 ? 'flex' : 'none';
            if (navbar) navbar.classList.toggle('scrolled', scrollY > 50);
        });
    }

    document.addEventListener('click', function(e) {
        const wrapper = document.getElementById('userMenuWrapper');
        if (wrapper && !wrapper.contains(e.target)) {
            const dropdown = document.getElementById('userDropdown');
            const arrow = document.getElementById('userMenuArrow');
            if (dropdown) dropdown.classList.remove('open');
            if (arrow) arrow.classList.remove('open');
        }
    });

    auth.onAuthStateChanged((user) => {
        currentUser = user;
        updateUIForAuth(user);
        if (user) {
            loadUserData(user.uid);
            loadUserProgress(user.uid);
            setTimeout(() => { loadCourses(); loadLessons(); loadLeaderboard(); }, 100);
        } else {
            loadCourses();
            loadLessons();
            loadLeaderboard();
        }
    });

    function init() {
        setupScrollHandlers();
        initTheme();
        updateInstallButtonVisibility();
        showHome();
        console.log('🚀 Yalla Chemistry Platform - ULTIMATE PROTECTION');
    }

    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }

    // ============================================================
    // APP OBJECT
    // ============================================================
    const APP = {
        toggleTheme,
        showHome,
        scrollToCourses,
        closeLoginOverlay,
        showLoginOverlay,
        toggleUserMenu,
        logout,
        filterCourses,
        filterCoursesByGrade,
        subscribeToCourse,
        openCoursePage,
        openLessonVideo,
        handleVideoExit,
        showLeaderboard,
        loadLeaderboard,
        showDashboard,
        showResults,
        openLessonExam,
        togglePlay,
        changeSpeed,
        changeQuality,
        toggleMute,
        changeVolume,
        toggleFullscreenVideo
    };

    window.APP = APP;
    </script>
</body>
</html>
