<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- ====== PWA Manifest ====== -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0B4F8C">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <meta name="description" content="منصة يلا كيمياء التعليمية - اشرح الكيمياء ببساطة مع مستر زياد مبروك">
    <link rel="icon" href="https://res.cloudinary.com/dbahe7lxz/image/upload/v1785593692/idraaak/ogvolfsxxnvk24gho8eb.jpg">
    <title>يلا كيمياء | المنصة التعليمية المتكاملة</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Lalezar&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

    <style>
        /* ====== CSS الأساسي ====== */
        :root {
            --bg: #EAF6FF;
            --card: #FFFFFF;
            --text: #081B2C;
            --text2: #0B4F8C;
            --border: #DCEFFF;
            --primary: #0B4F8C;
            --primary2: #1E81CE;
            --accent: #4CC9F0;
            --gold: #FFD60A;
            --gold-dark: #D4A800;
            --success: #22C55E;
            --danger: #EF4444;
            --warning: #FFA726;
            --shadow: 0 4px 12px rgba(11, 79, 140, 0.10);
            --radius: 16px;
            --radius-lg: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #F8FAFC;
            --text2: #38BDF8;
            --border: #334155;
            --primary: #38BDF8;
            --primary2: #0EA5E9;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(11, 79, 140, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: var(--transition);
            padding: 6px 0;
        }
        [data-theme="dark"] .navbar {
            background: rgba(15, 23, 42, 0.9);
            border-bottom-color: rgba(255, 255, 255, 0.05);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            flex-shrink: 0;
        }
        .nav-logo img {
            width: clamp(24px, 3vw, 40px);
            height: clamp(24px, 3vw, 40px);
            object-fit: contain;
        }
        .nav-logo span {
            font-family: 'Lalezar', cursive;
            font-size: clamp(0.75rem, 1.2vw, 1.2rem);
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 3px;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a, .nav-links button {
            padding: clamp(2px, 0.5vw, 6px) clamp(6px, 1vw, 14px);
            border-radius: 50px;
            font-weight: 600;
            font-size: clamp(0.55rem, 0.7vw, 0.8rem);
            transition: var(--transition);
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text2);
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
        }
        .nav-links a:hover, .nav-links button:hover {
            background: var(--border);
            color: var(--primary);
            transform: translateY(-1px);
        }
        .nav-links .btn-primary-nav {
            background: var(--primary);
            color: #fff !important;
            padding: clamp(2px, 0.5vw, 6px) clamp(10px, 1.5vw, 18px);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: clamp(6px, 1vw, 12px) clamp(14px, 2.5vw, 32px);
            border-radius: 50px;
            font-weight: 700;
            font-size: clamp(0.7rem, 0.8vw, 0.95rem);
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(11, 79, 140, 0.25);
            font-family: 'Cairo', sans-serif;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(11, 79, 140, 0.35);
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: clamp(6px, 1vw, 12px) clamp(14px, 2.5vw, 32px);
            border-radius: 50px;
            font-weight: 700;
            font-size: clamp(0.7rem, 0.8vw, 0.95rem);
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
        }
        .btn-outline:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-sm { padding: clamp(4px, 0.5vw, 8px) clamp(10px, 1.5vw, 20px); font-size: clamp(0.6rem, 0.7vw, 0.8rem); }

        /* ====== Toast ====== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            padding: 14px 32px;
            border-radius: var(--radius);
            font-weight: 600;
            animation: slideUp 0.4s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            font-size: 0.95rem;
            font-family: 'Cairo', sans-serif;
            pointer-events: none;
        }
        .toast-success { background: var(--success); color: #fff; }
        .toast-error { background: var(--danger); color: #fff; }
        .toast-info { background: var(--primary); color: #fff; }
        .toast-warning { background: var(--warning); color: #fff; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ====== زر التثبيت الثابت ====== */
        @keyframes pulse-install {
            0%, 100% { box-shadow: 0 8px 32px rgba(255, 214, 10, 0.4); }
            50% { box-shadow: 0 8px 48px rgba(255, 214, 10, 0.8); transform: translateX(-50%) scale(1.02); }
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ====== باقي الـ CSS ====== */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            height: 100%;
            position: relative;
        }
        .card:hover { 
            box-shadow: var(--shadow); 
            transform: translateY(-5px);
            border-color: var(--primary);
        }
        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.5s;
            aspect-ratio: 16/9;
            background: var(--bg);
        }
        @media (max-width: 768px) { .card-img { height: 170px; } }
        @media (max-width: 480px) { .card-img { height: 150px; } }
        .card-body { padding: 16px 18px; }

        .grid-courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        @media (max-width: 768px) {
            .grid-courses { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        }
        @media (max-width: 480px) {
            .grid-courses { grid-template-columns: 1fr; gap: 12px; }
        }

        .video-wrapper {
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            margin-bottom: 24px;
            background: #000;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            background: var(--bg);
            border-radius: var(--radius-lg);
            border: 2px dashed var(--border);
        }
        .empty-state .icon { font-size: 4rem; margin-bottom: 12px; }
        .empty-state h3 { font-size: 1.3rem; font-weight: 700; color: var(--text); }
        .empty-state p { color: var(--text2); margin-top: 4px; }

        .skeleton {
            background: linear-gradient(90deg, var(--border) 25%, var(--bg) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius);
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (max-width: 768px) {
            .nav-container { padding: 0 8px; gap: 4px; }
            .nav-links { gap: 2px; }
            .nav-links a, .nav-links button { font-size: 0.6rem; padding: 3px 8px; }
            .nav-logo span { font-size: 0.85rem; }
            .nav-logo img { width: 28px; height: 28px; }
            .btn-primary, .btn-outline { padding: 8px 18px; font-size: 0.8rem; }
        }
        @media (max-width: 480px) {
            .nav-container { padding: 0 4px; gap: 2px; }
            .nav-links a, .nav-links button { font-size: 0.55rem; padding: 2px 6px; }
            .nav-logo span { font-size: 0.75rem; }
            .nav-logo img { width: 24px; height: 24px; }
            .btn-primary, .btn-outline { padding: 6px 14px; font-size: 0.7rem; }
            .grid-courses { grid-template-columns: 1fr; gap: 12px; }
            .card-img { height: 150px; }
        }
    </style>
</head>
<body>
    <!-- Toast Container -->
    <div id="toastContainer" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99999;width:90%;max-width:500px;pointer-events:none;"></div>

    <!-- ====== NAVBAR ====== -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo" onclick="APP.showHome()">
                <img src="https://res.cloudinary.com/dbahe7lxz/image/upload/v1785593692/idraaak/ogvolfsxxnvk24gho8eb.jpg" alt="يلا كيمياء">
                <span>يلا كيمياء</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="#" onclick="APP.showHome()">🏠 الرئيسية</a></li>
                <li><a href="#" onclick="APP.scrollToCourses()">📚 الكورسات</a></li>
                <li><a href="login.html" class="btn-primary-nav">تسجيل الدخول</a></li>
            </ul>
        </div>
    </nav>

    <!-- ====== MAIN CONTENT ====== -->
    <main id="mainContent">
        <!-- يتم تحميل المحتوى بواسطة JavaScript -->
    </main>

    <script>
    // ============================================================
    // 📱 PWA INSTALL - زر التحميل الثابت (شغال في كل حته)
    // ============================================================

    let deferredPrompt = null;
    let installButton = null;

    // 1️⃣ إنشاء الزر بشكل ديناميكي
    function createInstallButton() {
        // لو الزر موجود بالفعل، نرجعه
        if (document.getElementById('customInstallBtn')) {
            return document.getElementById('customInstallBtn');
        }

        const btn = document.createElement('button');
        btn.id = 'customInstallBtn';
        btn.innerHTML = `
            <i class="fas fa-download" style="margin-left: 8px;"></i>
            📲 حمل التطبيق الآن
        `;
        btn.style.cssText = `
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            padding: 14px 32px;
            border-radius: 50px;
            background: linear-gradient(135deg, #FFD60A, #FFB700);
            color: #081B2C;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(255, 214, 10, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: pulse-install 2s infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 200px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        `;
        
        // إضافة تأثير hover
        btn.onmouseover = () => {
            btn.style.transform = 'translateX(-50%) scale(1.05)';
            btn.style.boxShadow = '0 12px 40px rgba(255, 214, 10, 0.6)';
        };
        btn.onmouseout = () => {
            btn.style.transform = 'translateX(-50%) scale(1)';
            btn.style.boxShadow = '0 8px 32px rgba(255, 214, 10, 0.4)';
        };

        // إضافة زر الإغلاق
        const closeBtn = document.createElement('button');
        closeBtn.innerHTML = '✕';
        closeBtn.style.cssText = `
            position: absolute;
            top: -10px;
            right: -10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        `;
        closeBtn.onmouseover = () => {
            closeBtn.style.transform = 'scale(1.2)';
        };
        closeBtn.onmouseout = () => {
            closeBtn.style.transform = 'scale(1)';
        };
        closeBtn.onclick = (e) => {
            e.stopPropagation();
            btn.style.display = 'none';
            localStorage.setItem('installBtnClosed', 'true');
            // نضبط مؤقت يظهره تاني بعد 24 ساعة
            setTimeout(() => {
                localStorage.removeItem('installBtnClosed');
                btn.style.display = 'flex';
            }, 86400000); // 24 ساعة
        };

        btn.appendChild(closeBtn);
        document.body.appendChild(btn);

        // إضافة الـ Keyframes للـ Animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse-install {
                0%, 100% { box-shadow: 0 8px 32px rgba(255, 214, 10, 0.4); }
                50% { box-shadow: 0 8px 48px rgba(255, 214, 10, 0.8); transform: translateX(-50%) scale(1.02); }
            }
        `;
        document.head.appendChild(style);

        return btn;
    }

    // 2️⃣ دالة التثبيت الأساسية (شغالة في كل حته)
    function installApp() {
        // الحالة 1: في المتصفحات اللي بتدعم PWA
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    showToast('✅ تم تثبيت التطبيق بنجاح! 🎉', 'success');
                    const btn = document.getElementById('customInstallBtn');
                    if (btn) btn.style.display = 'none';
                    localStorage.setItem('appInstalled', 'true');
                } else {
                    showToast('❌ تم إلغاء التثبيت', 'warning');
                }
                deferredPrompt = null;
            });
            return;
        }

        // الحالة 2: في الأجهزة المحمولة (iOS/Android)
        if (window.navigator && window.navigator.share) {
            showInstallInstructions();
            return;
        }

        // الحالة 3: على الكمبيوتر (Windows/Mac)
        if (window.navigator.userAgent.includes('Windows') || 
            window.navigator.userAgent.includes('Macintosh')) {
            showInstallInstructions();
            return;
        }

        // الحالة 4: أي جهاز تاني (حل عام)
        showInstallInstructions();
    }

    // 3️⃣ عرض تعليمات التثبيت
    function showInstallInstructions() {
        const modal = document.createElement('div');
        modal.id = 'installHelpModal';
        modal.style.cssText = `
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: modalIn 0.4s ease;
        `;

        const isIOS = /iPhone|iPad|iPod/i.test(window.navigator.userAgent);
        const isAndroid = /Android/i.test(window.navigator.userAgent);

        let steps = '';
        if (isIOS) {
            steps = `
                <p>1. اضغط على زر <strong>المشاركة</strong> (المربع مع السهم) 🟦</p>
                <p>2. اختر <strong>"أضف إلى الشاشة الرئيسية"</strong> 📱</p>
                <p>3. اضغط على <strong>"إضافة"</strong> ✅</p>
            `;
        } else if (isAndroid) {
            steps = `
                <p>1. اضغط على النقاط الثلاثة (⋮) في الأعلى</p>
                <p>2. اختر <strong>"تثبيت التطبيق"</strong> أو <strong>"Install App"</strong></p>
                <p>3. اضغط على <strong>"تثبيت"</strong> ✅</p>
            `;
        } else {
            steps = `
                <p>1. في شريط العنوان، ابحث عن أيقونة <strong>➕</strong> أو <strong>⬇️</strong></p>
                <p>2. اضغط على <strong>"تثبيت التطبيق"</strong> أو <strong>"Install App"</strong></p>
                <p>3. اتبع الخطوات لإكمال التثبيت ✅</p>
            `;
        }

        modal.innerHTML = `
            <div style="
                background: var(--card, #fff);
                border-radius: 24px;
                padding: 32px 28px;
                max-width: 450px;
                width: 100%;
                text-align: center;
                border: 2px solid var(--gold, #FFD60A);
                box-shadow: 0 40px 80px rgba(0,0,0,0.5);
                max-height: 90vh;
                overflow-y: auto;
                position: relative;
            ">
                <button onclick="this.closest('#installHelpModal').remove()" style="
                    position: absolute;
                    top: 12px;
                    right: 12px;
                    width: 36px;
                    height: 36px;
                    border-radius: 50%;
                    border: none;
                    background: rgba(0,0,0,0.1);
                    color: var(--text, #333);
                    font-size: 1.2rem;
                    cursor: pointer;
                    transition: all 0.3s;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                ">✕</button>
                
                <div style="font-size: 3.5rem; margin-bottom: 8px;">📲</div>
                <h2 style="font-family: 'Lalezar', cursive; font-size: 1.8rem; color: var(--primary, #0B4F8C); margin-bottom: 4px;">
                    تثبيت التطبيق
                </h2>
                <p style="color: var(--text2, #555); margin-bottom: 16px; font-size: 1rem;">
                    حمل التطبيق على جهازك واستمتع بتجربة أفضل! 🚀
                </p>
                
                <div style="
                    background: var(--bg, #f5f5f5);
                    border-radius: 16px;
                    padding: 20px;
                    text-align: right;
                    margin: 16px 0;
                    line-height: 2.2;
                    font-size: 0.95rem;
                    color: var(--text, #333);
                ">
                    ${steps}
                </div>

                <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 16px;">
                    <button onclick="window.location.href='${window.location.href}'" style="
                        padding: 14px;
                        border-radius: 50px;
                        border: none;
                        background: var(--primary, #0B4F8C);
                        color: #fff;
                        font-weight: 700;
                        font-size: 1rem;
                        cursor: pointer;
                        transition: all 0.3s;
                        font-family: 'Cairo', sans-serif;
                    ">
                        🔄 إعادة تحميل الصفحة
                    </button>
                    <button onclick="this.closest('#installHelpModal').remove()" style="
                        padding: 12px;
                        border-radius: 50px;
                        border: 2px solid var(--border, #ddd);
                        background: transparent;
                        color: var(--text2, #555);
                        font-weight: 600;
                        font-size: 0.9rem;
                        cursor: pointer;
                        transition: all 0.3s;
                        font-family: 'Cairo', sans-serif;
                    ">
                        ✖ إغلاق
                    </button>
                </div>
            </div>
        `;

        document.body.appendChild(modal);
    }

    // 4️⃣ تحديث حالة الزر (يظهر في كل حته)
    function updateInstallButton() {
        // لو المستخدم قفل الزر أو ثبت التطبيق، مش نظهره
        if (localStorage.getItem('installBtnClosed') === 'true') return;
        if (localStorage.getItem('appInstalled') === 'true') {
            if (window.matchMedia('(display-mode: standalone)').matches) {
                return;
            }
        }

        const btn = createInstallButton();
        btn.onclick = installApp;
        btn.style.display = 'flex';
    }

    // 5️⃣ مستمعين الأحداث

    function loadUserData(uid) {
        database.ref('users/' + uid).once('value', (snapshot) => {
            if (snapshot.exists()) {
                userData = snapshot.val();
            }
        });
    }

    function loadUserProgress(uid) {
        database.ref('users/' + uid + '/progress').once('value', (snapshot) => {
            if (snapshot.exists()) {
                userCourseProgress = snapshot.val();
            }
        });
    }

    // ============================================================
    // COURSES
    // ============================================================
    function loadCourses() {
        database.ref('courses').once('value', (snapshot) => {
            allCourses = [];
            snapshot.forEach((child) => {
                const data = child.val();
                allCourses.push({ id: child.key, ...data });
            });
            allCourses.sort((a, b) => (a.order || 0) - (b.order || 0));
            renderCourses(allCourses);
        });
    }

    function loadLessons() {
        database.ref('lessons').once('value', (snapshot) => {
            allLessons = [];
            snapshot.forEach((child) => {
                allLessons.push({ id: child.key, ...child.val() });
            });
        });
    }

    function renderCourses(courses) {
        const grid = document.getElementById('coursesGrid');
        if (!grid) return;
        if (!courses || courses.length === 0) {
            grid.innerHTML = `<div class="empty-state"><div class="icon">📚</div><h3>لا توجد كورسات</h3></div>`;
            return;
        }
        grid.innerHTML = courses.map(c => {
            const isFree = c.isFree !== false;
            const lessons = allLessons.filter(l => l.courseId === c.id);
            const completed = lessons.filter(l => userCourseProgress[l.id]?.watched);
            const isCompleted = lessons.length > 0 && completed.length === lessons.length;
            return `
                <div class="card" style="cursor:pointer;" onclick="APP.openCoursePage('${c.id}')">
                    <img src="${c.image || 'https://placehold.co/600x400/1a1f2e/0B4F8C?text=كورس'}" alt="${escapeHtml(c.title)}" class="card-img" loading="lazy">
                    <div class="card-body">
                        <h3 style="font-weight:800;font-size:1.2rem;color:var(--text);">${escapeHtml(c.title)}</h3>
                        <p style="font-size:0.85rem;color:var(--text2);margin:6px 0;">${escapeHtml(c.description)}</p>
                        <div style="display:flex;flex-wrap:wrap;gap:4px 10px;font-size:0.7rem;color:var(--text2);">
                            <span>🎯 ${c.grade || 'كل الصفوف'}</span>
                            <span>📚 ${c.lessonsCount || 0} حصة</span>
                            <span class="price-tag" style="padding:2px 12px;border-radius:20px;background:${isFree ? 'var(--success)' : 'var(--gold)'};color:${isFree ? '#fff' : '#081B2C'};font-weight:700;">${isFree ? '🆓 مجاني' : '💰 مدفوع'}</span>
                            ${isCompleted ? '<span style="padding:2px 12px;border-radius:20px;background:var(--success);color:#fff;font-weight:700;">✅ مكتمل</span>' : ''}
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ============================================================
    // COURSE PAGE
    // ============================================================
    function openCoursePage(courseId) {
        const course = allCourses.find(c => c.id === courseId);
        if (!course) { showToast('الكورس غير موجود', 'error'); return; }
        const main = document.getElementById('mainContent');
        const lessons = allLessons.filter(l => l.courseId === courseId);
        lessons.sort((a, b) => (a.order || 0) - (b.order || 0));
        const isFree = course.isFree !== false;
        
        let lessonsHtml = lessons.map((lesson, idx) => {
            const isCompleted = userCourseProgress[lesson.id]?.watched || false;
            return `
                <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
                    <span>${idx + 1}. ${escapeHtml(lesson.title)}</span>
                    ${isCompleted ? '<span style="color:var(--success);font-weight:700;">✅ مكتمل</span>' : '<button class="btn-primary btn-sm" onclick="APP.openLessonVideo(\''+lesson.id+'\')">▶ مشاهدة</button>'}
                </div>
            `;
        }).join('');

        main.innerHTML = `
            <div style="max-width:1280px;margin:0 auto;padding:20px;">
                <button class="btn-outline btn-sm no-print" onclick="APP.showHome()"><i class="fas fa-arrow-right"></i> العودة</button>
                <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;background:var(--card);border-radius:var(--radius-lg);padding:24px;border:1px solid var(--border);margin:12px 0;">
                    ${course.image ? `<img src="${course.image}" alt="${escapeHtml(course.title)}" style="width:120px;height:120px;border-radius:var(--radius);object-fit:cover;">` : ''}
                    <div>
                        <h1 style="font-family:'Lalezar',cursive;font-size:2rem;color:var(--text);">${escapeHtml(course.title)}</h1>
                        <p style="color:var(--text2);">${escapeHtml(course.description)}</p>
                        <span class="price-tag" style="padding:4px 16px;border-radius:20px;background:${isFree ? 'var(--success)' : 'var(--gold)'};color:${isFree ? '#fff' : '#081B2C'};font-weight:700;">${isFree ? '🆓 مجاني' : '💰 مدفوع'}</span>
                    </div>
                </div>
                <h3 style="font-weight:700;font-size:1.2rem;color:var(--primary);margin-bottom:12px;">📚 قائمة الحصص</h3>
                ${lessonsHtml || '<div class="empty-state"><div class="icon">📚</div><h3>لا توجد حصص</h3></div>'}
            </div>
        `;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    // LESSON VIDEO
    // ============================================================
    function openLessonVideo(lessonId) {
        const lesson = allLessons.find(l => l.id === lessonId);
        if (!lesson) { showToast('الحصة غير موجودة', 'error'); return; }
        const videoId = extractYouTubeId(lesson.videoUrl);
        if (!videoId) { showToast('⚠️ لا يوجد فيديو', 'warning'); return; }
        
        const main = document.getElementById('mainContent');
        main.innerHTML = `
            <div style="max-width:1100px;margin:0 auto;padding:16px;">
                <button class="btn-outline btn-sm" onclick="APP.openCoursePage('${lesson.courseId}')"><i class="fas fa-arrow-right"></i> العودة</button>
                <div class="video-wrapper" style="margin-top:12px;">
                    <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>
        `;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function extractYouTubeId(url) {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }
